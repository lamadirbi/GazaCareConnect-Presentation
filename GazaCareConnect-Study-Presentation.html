<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<!-- v:20260804ao -->
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GazaCare Connect — عرض المشروع v20260804o</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Outfit:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#f5fafb; --ink:#123037; --muted:#4f6d74; --teal:#0f8f86; --teal2:#0b6f69;
  --line:rgba(15,143,134,.16); --card:#fff; --warn:#7a5c00;
  --ar:"Cairo",sans-serif; --en:"Outfit",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--ar)}
body{overflow:hidden}
body.en{font-family:var(--en)}
body.en .slide-title,body.en .summary,body.en .lead,body.en .bullet,body.en .note,body.en .caption,body.en .section-sub{direction:ltr;text-align:left}
body.en table{direction:ltr}
#app{height:100%;display:grid;grid-template-rows:58px minmax(0,1fr) auto}
.topbar,.nav{background:#fff;border-color:var(--line)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 14px;border-bottom:1px solid var(--line)}
.brand{display:flex;gap:10px;align-items:center;min-width:0}
.logo{width:40px;height:40px;border-radius:10px;overflow:hidden;background:#fff;flex-shrink:0;display:block;object-fit:contain;padding:2px;box-sizing:border-box;border:1px solid var(--line)}
.brand h1{font-size:14px;margin:0}
.brand small{display:block;color:var(--muted);font-size:11px;font-family:var(--en)}
.actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:8px 12px;font:700 12px var(--ar);cursor:pointer;text-decoration:none}
.btn.primary{background:linear-gradient(135deg,var(--teal),var(--teal2));color:#fff;border:0}
.btn.active{background:rgba(15,143,134,.12);color:var(--teal2);border-color:var(--teal)}
.stage{min-height:0;overflow:hidden;position:relative}
.slide{
  position:absolute;inset:0;display:none;overflow:auto;overscroll-behavior:contain;
  padding:22px 28px 28px;
  background:
    radial-gradient(800px 360px at 100% 0%, rgba(15,143,134,.08), transparent 60%),
    radial-gradient(700px 320px at 0% 100%, rgba(11,111,105,.06), transparent 55%),
    var(--bg);
  -webkit-overflow-scrolling:touch;
}
.slide.active{display:block;animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.slide-inner{max-width:1180px;margin:0 auto;padding-bottom:24px}
.kicker{font-family:var(--en);letter-spacing:.12em;text-transform:uppercase;color:var(--teal);font-size:11px;margin-bottom:8px}
.slide-title{font-size:clamp(24px,3.2vw,36px);line-height:1.35;margin:0 0 10px;max-width:28ch}
.section-sub{color:var(--muted);font-size:15px;margin:0 0 14px;line-height:1.7}
.summary-box{margin-bottom:18px}
.summary-title{
  display:inline-block;margin:0 0 12px;padding:6px 12px;border-radius:999px;
  background:rgba(15,143,134,.12);color:#0b6a64;font-size:13px;font-weight:800
}
.summary-points{display:flex;flex-direction:column;gap:10px}
.summary-point{
  display:flex;gap:12px;align-items:flex-start;background:#fff;border:1px solid var(--line);
  border-radius:14px;padding:14px 16px;box-shadow:0 6px 18px rgba(18,48,55,.04)
}
.summary-point .n{
  flex:0 0 auto;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--teal),var(--teal2));color:#fff;
  font-family:var(--en);font-weight:800;font-size:13px
}
.summary-point p{margin:0;font-size:17px;line-height:1.85;font-weight:600;color:var(--ink)}
.section-slide .summary-point p{font-size:18px;line-height:1.9}
.slide-title{letter-spacing:-0.01em}

.layout{display:grid;grid-template-columns:1.1fr .9fr;gap:16px;align-items:start}
.layout.solo,.layout.gallery-only{grid-template-columns:1fr}
@media(max-width:980px){.layout{grid-template-columns:1fr}}
.bullets{display:flex;flex-direction:column;gap:10px}
.bullet{
  display:flex;gap:12px;align-items:flex-start;background:#fff;border:1px solid var(--line);
  border-radius:14px;padding:12px 14px;box-shadow:0 6px 18px rgba(18,48,55,.04)
}
.num{flex:0 0 auto;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(135deg,var(--teal),var(--teal2));color:#fff;font-family:var(--en);font-weight:800;font-size:12px}
.bullet p{margin:0;font-size:15px;line-height:1.75}
.lead{
  margin:0 0 14px;padding:12px 14px;border-radius:12px;
  background:rgba(15,143,134,.06);border:1px solid rgba(15,143,134,.14);
  color:var(--ink);font-size:15.5px;line-height:1.75;font-weight:600
}
.note{
  margin:0 0 14px;padding:12px 14px;border-radius:12px;
  background:#fff8ef;border:1px solid rgba(196,120,42,.25);
  color:#8a4b12;font-weight:700;font-size:14px;line-height:1.7
}
.note.bottom{margin:14px 0 0}


.seq-board{display:flex;flex-direction:column;gap:14px;margin-top:2px}
.seq-layers{
  display:grid;grid-template-columns:repeat(3,1fr);gap:8px
}
.seq-layer{
  text-align:center;border-radius:12px;padding:10px 8px;font-weight:900;font-size:13px;
  border:1px solid var(--line);background:#fff
}
.seq-layer b{display:block;font-size:12px;font-weight:700;color:#4a6b72;margin-top:2px}
.seq-layer.fe{background:#eef8f7;border-color:rgba(15,143,134,.28);color:#0b5f59}
.seq-layer.be{background:#eef3fb;border-color:rgba(55,100,180,.25);color:#274b8c}
.seq-layer.db{background:#fff7ec;border-color:rgba(196,120,42,.28);color:#8a4b12}
.seq-grid{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px
}
@media(max-width:900px){.seq-grid{grid-template-columns:1fr}.seq-layers{grid-template-columns:1fr}}
.seq-card{
  background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;
  box-shadow:0 6px 18px rgba(18,48,55,.04);display:flex;flex-direction:column;gap:8px
}
.seq-card h3{
  margin:0;font-size:14.5px;font-weight:900;color:#0f5c66;
  padding-bottom:6px;border-bottom:1px dashed rgba(15,143,134,.25)
}
.seq-pipe{
  display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:4px;
  font-family:var(--en);font-size:11.5px;font-weight:800
}
.seq-chip{
  border-radius:999px;padding:4px 8px;border:1px solid rgba(15,143,134,.2);background:#f3fbfb;color:#0b5f59
}
.seq-chip.be{background:#eef3fb;border-color:rgba(55,100,180,.22);color:#274b8c}
.seq-chip.db{background:#fff7ec;border-color:rgba(196,120,42,.25);color:#8a4b12}
.seq-arrow{color:#7a9399;font-weight:900}
.seq-outcomes{display:grid;grid-template-columns:1fr 1fr;gap:6px}
@media(max-width:600px){.seq-outcomes{grid-template-columns:1fr}}
.seq-ok,.seq-bad{
  border-radius:10px;padding:7px 8px;font-size:12px;line-height:1.55;font-weight:700
}
.seq-ok{background:#eefaf3;border:1px solid rgba(34,140,80,.22);color:#1d6b40}
.seq-bad{background:#fff1f1;border:1px solid rgba(180,60,60,.2);color:#8f2f2f}
.seq-ok b,.seq-bad b{display:block;margin-bottom:2px;font-size:11px}

.flow-map{display:flex;flex-direction:column;gap:14px;margin-top:4px}
.flow-label,.flow-fork,.flow-join{
  text-align:center;font-weight:800;font-size:13.5px;color:#0b5f59;letter-spacing:.01em
}
.flow-fork,.flow-join{color:#8a4b12}
.flow-block{
  background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;
  box-shadow:0 6px 18px rgba(18,48,55,.04)
}
.flow-shared{display:flex;flex-direction:column;align-items:center;gap:8px}
.flow-node{
  width:min(100%,560px);text-align:center;background:#f3fbfb;border:1px solid rgba(15,143,134,.22);
  border-radius:14px;padding:10px 14px;font-weight:800;font-size:14px;line-height:1.55;color:var(--ink)
}
.flow-node span{display:block;font-weight:600;font-size:13px;color:#3a5a62;margin-top:6px;line-height:1.55;max-width:52ch;margin-inline:auto}
.flow-node.accent{background:#e8f7f5;border-color:rgba(15,143,134,.45)}
.flow-node.accent2{background:#fff7ec;border-color:rgba(196,120,42,.35)}
.flow-arrow{font-size:18px;color:var(--teal);font-weight:900;line-height:1}
.flow-branches{
  display:grid;grid-template-columns:1fr 1fr;gap:12px;position:relative
}
.flow-branches:before{
  content:"";position:absolute;top:-8px;left:50%;width:2px;height:8px;background:rgba(15,143,134,.35);
  transform:translateX(-50%)
}
.flow-branch{
  background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;
  box-shadow:0 6px 18px rgba(18,48,55,.04);display:flex;flex-direction:column;gap:10px
}
.flow-branch-title{
  text-align:center;font-weight:900;font-size:14px;color:#0f5c66;
  padding:6px 8px;border-radius:10px;background:rgba(15,143,134,.08)
}
.flow-branch:last-child .flow-branch-title{background:rgba(196,120,42,.12);color:#8a4b12}
@media(max-width:700px){.flow-branches{grid-template-columns:1fr}}

.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:14px;background:#fff;box-shadow:0 6px 18px rgba(18,48,55,.04)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:11px 12px;border-bottom:1px solid rgba(15,143,134,.1);vertical-align:top;line-height:1.65}
.table-wrap td{line-height:1.55;font-size:14px;vertical-align:top}
.table-wrap th:first-child,.table-wrap td:first-child{white-space:nowrap;width:22%;font-weight:700;color:#0f5c66}
th{background:rgba(15,143,134,.1);color:#0b5f59;position:sticky;top:0}
tr:nth-child(even) td{background:#f7fbfc}
.gallery{display:grid;gap:12px}
.gallery.g1{grid-template-columns:1fr}
.gallery.g2{grid-template-columns:1fr 1fr}
.gallery.g3{grid-template-columns:1fr 1fr}
.gallery.g4,.gallery.g5,.gallery.g-many{grid-template-columns:repeat(3,minmax(0,1fr))}
@media(max-width:980px){.gallery.g4,.gallery.g5,.gallery.g-many{grid-template-columns:1fr 1fr}}
@media(max-width:700px){.gallery.g2,.gallery.g3,.gallery.g4,.gallery.g5,.gallery.g-many{grid-template-columns:1fr}}
.shot{
  background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;
  box-shadow:0 8px 22px rgba(18,48,55,.05);cursor:zoom-in
}
.shot .img-box{
  background:#eef6f7;min-height:180px;max-height:420px;display:flex;align-items:center;justify-content:center;padding:8px
}
.gallery.g1 .shot .img-box{
  min-height:min(52vh,560px);max-height:min(72vh,760px);padding:6px
}
.layout.solo .gallery.g1 .shot .img-box{
  min-height:min(58vh,620px);max-height:min(78vh,820px)
}
.shot img{max-width:100%;max-height:400px;width:auto;height:auto;object-fit:contain;display:block;image-rendering:auto}
.gallery.g1 .shot img{
  max-width:100%;max-height:min(70vh,740px);width:auto;height:auto;object-fit:contain
}
.layout.solo .gallery.g1 .shot img{
  max-height:min(76vh,800px);width:100%;object-fit:contain
}
.caption{padding:10px 12px;font-size:12.5px;color:var(--muted);border-top:1px solid var(--line)}
.section-slide .slide-title{margin-top:8vh;font-size:clamp(30px,4.5vw,48px)}
.nav{
  display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;
  padding:10px 16px;border-top:1px solid var(--line);background:#fff;min-height:72px
}
.nav-mid{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0;width:100%}
.nav-actions{display:flex;align-items:center;gap:8px;flex-shrink:0}
.nav-btn{
  display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px;border:1px solid var(--line);
  border-radius:999px;background:#fff;color:var(--teal2);cursor:pointer;font:700 13px var(--ar);
  position:relative
}
.nav-btn:hover{background:var(--teal2);color:#fff;border-color:var(--teal2)}
.nav-btn span.arrow{font-family:var(--en);font-size:16px;line-height:1}
.progress-text{
  font-family:var(--ar);font-size:13px;color:var(--ink);text-align:center;font-weight:800;
  white-space:nowrap;line-height:1.4;flex-shrink:0;padding:0 8px
}
.chapter-rail{
  display:flex;flex-wrap:nowrap;gap:6px;justify-content:flex-start;align-items:center;
  max-width:100%;overflow-x:auto;overflow-y:hidden;padding:2px 4px;scrollbar-width:thin
}
.bar{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,var(--teal),#7ad9d1);z-index:30;width:0;transition:width .25s}
.chip{
  border:1px solid var(--line);background:#fff;color:#355965;border-radius:999px;
  padding:6px 11px;font-size:12px;cursor:pointer;font-family:var(--ar);font-weight:700;white-space:nowrap
}
.chip:hover{border-color:var(--teal);color:var(--teal2)}
.chip.on{background:var(--teal);color:#fff;border-color:transparent}
body.en .nav-btn, body.en .chip, body.en .progress-text{font-family:var(--en)}
.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:#fff;border:1px solid var(--line);padding:10px 14px;border-radius:999px;font-size:12px;opacity:0;pointer-events:none;transition:.25s;z-index:40;box-shadow:0 10px 28px rgba(18,48,55,.1)}
.toast.show{opacity:1}
.lightbox{
  position:fixed;inset:0;background:rgba(8,24,28,.82);display:none;
  align-items:center;justify-content:center;z-index:50;padding:18px;overflow:hidden
}
.lightbox.show{display:flex}
.lightbox-stage{
  position:relative;width:min(1200px,96vw);height:min(90vh,920px);
  display:flex;align-items:center;justify-content:center;overflow:hidden;
  background:#fff;border-radius:14px;box-shadow:0 18px 50px rgba(0,0,0,.28)
}
.lightbox img{
  max-width:none;max-height:none;width:auto;height:auto;object-fit:contain;
  transform-origin:center center;transition:transform .08s linear;user-select:none;
  -webkit-user-drag:none;cursor:grab;padding:0;background:#fff;
  image-rendering:-webkit-optimize-contrast;image-rendering:auto
}
.lightbox img.dragging{cursor:grabbing;transition:none}
.lightbox-ui{
  position:absolute;bottom:22px;left:50%;transform:translateX(-50%);
  display:flex;gap:8px;align-items:center;z-index:2;
  background:rgba(255,255,255,.94);border:1px solid rgba(15,143,134,.25);
  border-radius:999px;padding:8px 10px;box-shadow:0 10px 28px rgba(0,0,0,.18)
}
.lightbox-ui button{
  border:0;background:linear-gradient(135deg,var(--teal),var(--teal2));color:#fff;
  width:36px;height:36px;border-radius:999px;font:800 18px var(--en);cursor:pointer
}
.lightbox-ui button:hover{filter:brightness(1.05)}
.lightbox-ui .zoom-label{
  min-width:58px;text-align:center;font:800 13px var(--en);color:#0b5f59
}
.lightbox-close{
  position:absolute;top:18px;inset-inline-end:18px;z-index:2;
  border:0;background:#fff;color:#0b5f59;width:40px;height:40px;border-radius:999px;
  font:800 20px var(--en);cursor:pointer;box-shadow:0 8px 22px rgba(0,0,0,.18)
}
.hint{color:var(--muted);font-size:12px;margin-top:8px}

/* ===== Mobile / responsive ===== */
@media (max-width:860px){
  #app{grid-template-rows:auto minmax(0,1fr) auto}
  .topbar{
    flex-wrap:nowrap;align-items:center;justify-content:space-between;
    gap:8px;padding:8px 10px;padding-top:max(8px,env(safe-area-inset-top));
    height:auto;min-height:52px
  }
  .brand{min-width:0;flex:1 1 auto;overflow:hidden}
  .brand h1{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .brand small{display:none}
  .logo{width:30px;height:30px}
  .actions{
    flex:0 0 auto;width:auto;max-width:none;overflow:visible;
    flex-wrap:nowrap;gap:4px;justify-content:flex-end
  }
  .btn{flex:0 0 auto;padding:6px 9px;font-size:11px;white-space:nowrap}
  .btn#btnFs,a#btnPptx,a#btnPptxEn{display:none!important}
  .btn#btnAr,.btn#btnEn{min-width:0;padding:6px 10px}
  .slide{padding:14px 12px 20px}
  .slide-title{max-width:none;font-size:clamp(20px,6.2vw,28px)}
  .section-slide .slide-title{margin-top:3vh;font-size:clamp(22px,7vw,34px)}
  .summary-point,.bullet{padding:10px 12px;gap:10px}
  .summary-point p{font-size:14.5px;line-height:1.7}
  .bullet p,.lead,.note{font-size:13.5px;line-height:1.65}
  .summary-point .n,.num{width:24px;height:24px;font-size:11px}
  .table-wrap{-webkit-overflow-scrolling:touch}
  table{font-size:12px;min-width:480px}
  th,td{padding:8px}
  .gallery.g1 .shot .img-box{min-height:200px;max-height:min(55vh,420px)}
  .shot img{max-height:220px}
  .gallery.g1 .shot img,.layout.solo .gallery.g1 .shot img{max-height:min(52vh,400px);width:100%}

  /* Bottom nav: progress/chapters on top row, prev/next below */
  .nav{
    display:grid;
    grid-template-columns:1fr 1fr;
    grid-template-rows:auto auto;
    gap:8px;
    padding:8px 10px max(10px,env(safe-area-inset-bottom));
    min-height:0;align-items:center
  }
  .nav-mid{
    grid-column:1 / -1;grid-row:1;gap:6px;width:100%;min-width:0
  }
  .nav-actions:first-of-type{grid-column:1;grid-row:2;justify-self:stretch}
  .nav-actions:last-of-type{grid-column:2;grid-row:2;justify-self:stretch}
  .nav-btn{
    width:100%;height:40px;padding:0 8px;justify-content:center;gap:4px
  }
  .nav-btn #prevLabel,.nav-btn #nextLabel{
    position:static;width:auto;height:auto;overflow:visible;clip:auto;
    font-size:12px
  }
  .progress-text{
    font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    max-width:100%;padding:0;line-height:1.3
  }
  .chapter-rail{
    width:100%;max-width:100%;justify-content:flex-start;
    -webkit-overflow-scrolling:touch;scrollbar-width:none
  }
  .chapter-rail::-webkit-scrollbar{display:none}
  .chip{padding:5px 9px;font-size:11px;flex:0 0 auto}
  .toast{bottom:110px}
  .lightbox{padding:8px}
  .lightbox-stage{width:100%;height:min(78vh,720px);border-radius:10px}
  .lightbox-ui{bottom:12px}
  .lightbox-close{top:10px}
}
@media (max-width:480px){
  .brand h1{font-size:12px}
  .btn#btnAr{padding:6px 8px}
  .btn#btnEn{padding:6px 8px}
  .nav-btn #prevLabel,.nav-btn #nextLabel{display:none}
  .nav-btn{min-width:48px;height:42px}
  .nav-btn span.arrow{font-size:18px}
}

@media print{
  .topbar,.nav,.bar,.hint,.lightbox,.toast,.lightbox-ui,.lightbox-close{display:none!important}
  html,body{background:#fff!important;overflow:visible!important;height:auto!important}
  #app{display:block!important;height:auto!important}
  .stage{display:block!important;height:auto!important;overflow:visible!important;padding:0!important}
  .slide{
    position:relative!important;display:block!important;overflow:visible!important;
    page-break-after:always;break-after:page;height:auto!important;min-height:0!important;
    background:#fff!important;border:0!important;box-shadow:none!important;margin:0!important
  }
  .slide-inner{max-width:100%!important;padding:18mm 14mm!important}
  .slide-title{font-size:22pt!important;color:#123037!important;text-align:right!important}
  body.en .slide-title{text-align:left!important}
  .summary-point p,.bullet p,.lead,.note{font-size:12.5pt!important;line-height:1.55!important;color:#123037!important}
  .summary-point,.bullet{box-shadow:none!important;border:1px solid #d7e6e8!important;break-inside:avoid}
  table{font-size:10.5pt!important}
  th,td{padding:8px!important}
  .shot{break-inside:avoid;box-shadow:none!important}
  .shot img{max-height:90mm!important}
  .kicker{color:#0b6a64!important}
}
</style>
</head>
<body>
<div class="bar" id="bar"></div>
<div id="app">
  <header class="topbar">
    <div class="brand">
      <img class="logo" src="presentation-assets/brand/logo.png" alt="GazaCare Connect" width="40" height="40">
      <div>
        <h1>GazaCare Connect</h1>
        <small id="brandSub">مشروع تخرج · هندسة البرمجيات</small>
      </div>

"Field","Details"],"rows_ar": [["Use Case ID","UC-20 / RQ-20"],["Use Case Name","إرسال التوصية الطبية"],["Actors","Physician"],["Description","يرسل الطبيب ردًا طبيًا مع تصنيف الشدة، ويمكنه إنهاء الاستشارة."],["Precondition","الاستشارة مسندة لطبيب موثّق."],["Basic Flow","1. يكتب التوصية<br>2. يختار الشدة: Mild (بسيطة) / Moderate (متوسطة) / Critical (حرجة)<br>3. يمكنه تعليمها كمكتملة<br>4. يرسل الرد<br>5. يُشعر النظام المريض"],["Alternate Flow","a. نقص التوصية أو التصنيف ← خطأ تحقق"],["Postcondition","أُرسلت التوصية وتحدّثت حالة الاستشارة."]],"rows_en": [["Use Case ID","UC-20 / RQ-20"],["Use Case Name","Send Medical Recommendation"],["Actors","Physician"],["Description","Physician sends a medical recommendation, assigns case severity, and optionally marks the consultation as completed."],["Precondition","Consultation is assigned to the verified physician."],["Basic Flow","1. Physician writes the recommendation.<br>2. Selects case severity (mild / moderate / critical).<br>3. Optionally marks the case as completed.<br>4. Submits the response.<br>5. System notifies the patient."],["Alternate Flow","a. Missing recommendation or severity → Validation error."],["Postcondition","Recommendation is sent; consultation is updated (pending review or completed)."]]},"note": {"ar": "باقي الطبيب باختصار: UC-15 تسجيل · UC-16 عرض الطلبات · UC-17 استلام عامة · UC-18/19 بيانات ومرفقات · UC-21 Follow-up · UC-22 حالات سابقة","en": "Other physician: UC-15 Register · UC-16 View requests · UC-17 Take general · UC-18/19 Patient data & files · UC-21 Follow-up · UC-22 Previous cases"},"timing": "0:45"},{"id": "ch4-uc-admin","chapter": 4,"kind": "table","title": {"ar": "مثال المسؤول: UC-25 / RQ-25 — توثيق الطبيب","en": "Admin example: UC-25 / RQ-25 — Physician Verification"},"subtitle": {"ar": "أهم حالة للمسؤول — المجموعة UC-23 إلى UC-25","en": "Key admin use case — group UC-23 to UC-25"},"summary": {"ar": "","en": ""},"summary_points": {"ar": [],"en": []},"bullets": {"ar": [],"en": []},"images": [],"table": {"headers_ar": ["الحقل","التفاصيل"],"headers_en": ["Field","Details"],"rows_ar": [["Use Case ID","UC-25 / RQ-25"],["Use Case Name","قبول/رفض توثيق الطبيب"],["Actors","Admin"],["Description","يراجع الـ Admin طلبات توثيق الأطباء ويقبلها أو يرفضها مع إشعار النتيجة."],["Precondition","يوجد طبيب واحد على الأقل بانتظار التوثيق."],["Basic Flow","1. يفتح صفحة الأطباء المعلّقين<br>2. يراجع التخصص والشهادات<br>3. يقبل أو يرفض<br>4. يحدّث النظام الحالة ويُشعر الطبيب"],["Alternate Flow","a. لا طلبات معلّقة ← قائمة فارغة"],["Postcondition","طبيب موثّق (يتعامل مع الاستشارات) أو مرفوض مع السبب وإمكانية إعادة التقديم."]],"rows_en": [["Use Case ID","UC-25 / RQ-25"],["Use Case Name","Approve / Reject Physician"],["Actors","Admin"],["Description","Admin reviews pending physician credentials and approves or rejects verification."],["Precondition","At least one physician registration is pending verification."],["Basic Flow","1. Admin opens pending physicians page.<br>2. Reviews specialty and certificate information.<br>3. Approves or rejects the physician.<br>4. System updates verification status and notifies the physician."],["Alternate Flow","a. No pending physicians → Empty list."],["Postcondition","Physician is verified (can handle consultations) or rejected with the reason for rejection and the ability to resubmit a verification request."]]},"note": {"ar": "باقي المسؤول باختصار: UC-23 إدارة المستخدمين · UC-24 تعطيل/تفعيل الحساب","en": "Other admin: UC-23 Manage users · UC-24 Disable/enable account"},"timing": "0:45"},{"id": "ch4-flow","chapter": 4,"kind": "content","title": {"ar": "مسار الاستشارة: عامة وموجهة لطبيب محدد","en": "Consultation path: general and physician-directed"},"subtitle": {"ar": "خطوات مشتركة ثم تفرع شجري للمسارين، ثم التقاء للرد والمتابعة","en": "Shared steps, then a tree branch for both paths, then join for reply and follow-up"},"summary": {"ar": "","en": ""},"summary_points": {"ar": [],"en": []},"bullets": {"ar": [],"en": []},"images": [],"table": null,"note": {"ar": "","en": ""},"timing": "1:00","diagram": {"ar": "<div class=\"flow-map\">\n  <div class=\"flow-block\">\n    <div class=\"flow-label\">أولًا — خطوات مشتركة</div>\n    <div class=\"flow-shared\">\n      <div class=\"flow-node\">1) UC-11 / RQ-11 — تقديم الاستشارة النصية<br><span>المريض يكتب سؤاله الطبي ويختار نوع الإسناد: استشارة عامة أو موجهة لطبيب محدد، ثم يرسل الطلب.</span></div>\n      <div class=\"flow-arrow\">↓</div>\n      <div class=\"flow-node\">2) UC-12 / RQ-12 — رفع المرفقات الطبية<br><span>يمكن إرفاق صور أو PDF مع الاستشارة عند الحاجة لدعم التشخيص (اختياري).</span></div>\n      <div class=\"flow-arrow\">↓</div>\n      <div class=\"flow-node\">3) Pending — بانتظار الطبيب<br><span>تُحفظ الاستشارة بحالة معلّقة حتى يستلمها طبيب موثّق ويرد عليها.</span></div>\n    </div>\n  </div>\n\n  <div class=\"flow-fork\">تفرع حسب نوع الاستشارة</div>\n\n  <div class=\"flow-branches\">\n    <div class=\"flow-branch\">\n      <div class=\"flow-branch-title\">استشارة عامة</div>\n      <div class=\"flow-node accent\">UC-17 / RQ-17 — استلام استشارة عامة<br><span>تدخل الطلب قائمة مشتركة، وأي طبيب موثّق يستطيع استلامها والبدء بمعالجتها.</span></div>\n    </div>\n    <div class=\"flow-branch\">\n      <div class=\"flow-branch-title\">استشارة موجهة لطبيب محدد</div>\n      <div class=\"flow-node accent2\">بدون UC-17 — إسناد مباشر<br><span>المريض اختار طبيبًا بعينه من البداية، فيصل الطلب له مباشرة دون قائمة مشتركة.</span></div>\n    </div>\n  </div>\n\n  <div class=\"flow-join\">↓ يلتقي المساران هنا ↓</div>\n\n  <div class=\"flow-block\">\n    <div class=\"flow-shared\">\n      <div class=\"flow-node\">UC-20 / RQ-20 — إرسال الرد الطبي<br><span>الطبيب يكتب التوصية ويصنّف شدة الحالة: Mild (بسيطة) / Moderate (متوسطة) / Critical (حرجة)، ثم يُشعر المريض.</span></div>\n      <div class=\"flow-arrow\">↓</div>\n      <div class=\"flow-node\">UC-14 / RQ-14 + UC-21 / RQ-21 — المتابعة<br><span>بعد أول رد يمكن للمريض والطبيب مواصلة النقاش برسائل Follow-up داخل نفس الاستشارة.</span></div>\n    </div>\n  </div>\n</div>","en": "<div class=\"flow-map\">\n  <div class=\"flow-block\">\n    <div class=\"flow-label\">First — shared steps</div>\n    <div class=\"flow-shared\">\n      <div class=\"flow-node\">1) UC-11 / RQ-11 — Submit text consultation<br><span>The patient writes the medical question, chooses general or physician-directed assignment, then submits.</span></div>\n      <div class=\"flow-arrow\">↓</div>\n      <div class=\"flow-node\">2) UC-12 / RQ-12 — Upload medical attachments<br><span>Optional images or PDF can be attached to support diagnosis.</span></div>\n      <div class=\"flow-arrow\">↓</div>\n      <div class=\"flow-node\">3) Pending — awaiting physician<br><span>The consultation stays pending until a verified physician takes it and replies.</span></div>\n    </div>\n  </div>\n\n  <div class=\"flow-fork\">Branch by consultation type</div>\n\n  <div class=\"flow-branches\">\n    <div class=\"flow-branch\">\n      <div class=\"flow-branch-title\">General consultation</div>\n      <div class=\"flow-node accent\">UC-17 / RQ-17 — Take a general consult<br><span>The request enters a shared list; any verified physician can take it and start handling it.</span></div>\n    </div>\n    <div class=\"flow-branch\">\n      <div class=\"flow-branch-title\">Physician-directed</div>\n      <div class=\"flow-node accent2\">No UC-17 — direct assignment<br><span>The patient already chose a specific physician, so the request goes to that physician directly.</span></div>\n    </div>\n  </div>\n\n  <div class=\"flow-join\">↓ Paths meet again ↓</div>\n\n  <div class=\"flow-block\">\n    <div class=\"flow-shared\">\n      <div class=\"flow-node\">UC-20 / RQ-20 — Send medical reply<br><span>The physician writes the recommendation and sets severity: Mild / Moderate / Critical, then the patient is notified.</span></div>\n      <div class=\"flow-arrow\">↓</div>\n      <div class=\"flow-node\">UC-14 / RQ-14 + UC-21 / RQ-21 — Follow-up<br><span>After the first reply, patient and physician can continue with Follow-up messages in the same consult.</span></div>\n    </div>\n  </div>\n</div>"}},{"id": "ch4-verify","chapter": 4,"kind": "content","title": {"ar": "قواعد التوثيق والصلاحيات","en": "Verification and Permission Rules"},"subtitle": {"ar": "تسلسل واضح من تسجيل الطبيب حتى التوثيق والصلاحيات","en": "A clear sequence from physician registration to verification and permissions"},"summary": {"ar": "","en": ""},"summary_points": {"ar": [],"en": []},"bullets": {"ar": ["UC-15 / RQ-15 (تسجيل الطبيب) — الطبيب الجديد ينشئ حسابًا ويبقى في حالة Pending Verification (بانتظار التوثيق)","قبل اعتماد UC-25 / RQ-25 (قبول أو رفض توثيق الأطباء): الطبيب يرى اللوحة فقط، ولا يستخدم UC-17 / RQ-17 (استلام استشارة عامة) ولا UC-20 / RQ-20 (إرسال الرد الطبي)","UC-25 / RQ-25 (قبول التوثيق من الـ Admin) — بعد القبول تُفعَّل للطبيب صلاحيات الاستلام والرد","عند الرفض عبر UC-25 / RQ-25 (رفض التوثيق مع ذكر السبب): يمكن للطبيب إعادة التقديم لاحقًا","UC-24 / RQ-24 (تعطيل أو تفعيل الحساب) — تعطيل الحساب يمنع الدخول إلى الميزات المحمية"],"en": ["UC-15 / RQ-15 (physician registration) — the new physician creates an account and stays Pending Verification","Before UC-25 / RQ-25 (approve or reject physician verification): the physician can see the dashboard only — no UC-17 / RQ-17 (take a general consult) and no UC-20 / RQ-20 (send medical reply)","UC-25 / RQ-25 (Admin approves verification) — after approval, take-case and reply permissions are enabled","If rejected via UC-25 / RQ-25 (reject verification with a reason): the physician can re-submit later","UC-24 / RQ-24 (disable or enable account) — disabling blocks access to protected features"]},"images": [],"table": null,"note": {"ar": "","en": ""},"timing": "0:50"},{"id": "ch5","chapter": 5,"kind": "section","title": {"ar": "الفصل الخامس — النمذجة والتصميم (UML)","en": "Chapter 5 — Modeling and Design"},"subtitle": {"ar": "","en": ""},"summary": {"ar": "","en": ""},"summary_points": {"ar": ["وُضعت خريطة UML واضحة للنظام قبل مرحلة البرمجة","تشمل المخططات: Activity Diagram و Use Case Diagram و Sequence Diagram و Class Diagram","تشكّل هذه المخططات الأساس المباشر للتنفيذ"],"en": ["UML maps were prepared before coding","Activity + use case + sequence + class diagrams","These diagrams are the basis for Chapter 6 implementation"]},"bullets": {"ar": [],"en": []},"images": [],"table": null,"note": {"ar": "","en": ""},"timing": "0:20"},{"id": "ch5-activity","chapter": 5,"kind": "media","title": {"ar": "Activity Diagram و Use Case Diagram","en": "Activity and Use Case Diagrams"},"subtitle": {"ar": "","en": ""},"summary": {"ar": "","en": ""},"summary_points": {"ar": [],"en": []},"bullets": {"ar": ["Activity Diagram يوضح مسار الاستشارة من البداية إلى النهاية","يظهر تفرّع المسارات حسب الدور: Patient و Physician و Admin","Use Case Diagram يحدد الـ Actors الثلاثة ووظائفهم","Actors: Patient و Physician و Admin"],"en": ["Activity diagram shows the consult path end to end","It branches by role: patient, physician, admin","Use case diagram defines the three actors and their functions","Actors: Patient, Physician, and Admin"]},"images": [{"src": "presentation-assets/media/image27.png","caption_ar": "مخطط النشاط","caption_en": "Activity diagram"},{"src": "presentation-assets/media/image28.jpeg","caption_ar": "مخطط حالات الاستخدام","caption_en": "Use case diagram"}],"table": null,"note": {"ar": "","en": ""},"timing": "1:00"},{"id": "ch5-seq","chapter": 5,"kind": "content","title": {"ar": "محاكاة مخططات التسلسل السبعة","en": "Visual simulation of the seven sequence diagrams"},"subtitle": {"ar": "الشاشة مقسومة لأقسام — كل قسم يحاكي المسار بين Frontend و Backend و Database","en": "Screen split into sections — each simulates Frontend ↔ Backend ↔ Database"},"summary": {"ar": "","en": ""},"summary_points": {"ar": [],"en": []},"bullets": {"ar": [],"en": []},"images": [],"table": null,"note": {"ar": "الشريحة التالية تعرض مخططات UML الأصلية لكل عملية.","en": "Next slide shows the original UML sequence diagrams."},"diagram": {"ar": "<div class=\"seq-board\">\n    <div class=\"seq-layers\">\n      <div class=\"seq-layer fe\">Frontend (React/Next.js)<b>واجهة المستخدم</b></div>\n      <div class=\"seq-layer be\">Backend (Laravel API)<b>منطق العمل والمصادقة</b></div>\n      <div class=\"seq-layer db\">Database (MySQL)<b>تخزين البيانات والـ Tokens</b></div>\n    </div>\n    <div class=\"seq-grid\"><div class=\"seq-card\">\n              <h3>1) التسجيل (Register)</h3>\n              <div class=\"seq-pipe\">\n      <span class=\"seq-chip\">User</span><span class=\"seq-arrow\">→</span>\n      <span class=\"seq-chip\">Frontend</span><span class=\"seq-arrow\">→</span>\n      <span class=\"seq-chip be\">Backend</span><span class=\"seq-arrow\">→</span>\n      <span class=\"seq-chip db\">Database</span>\n    </div>\n              <div class=\"seq-outcomes\">\n                <div class=\"seq-ok\"><b>✓ نجاح</b>إنشاء حساب + دخول تلقائي (201 + Token)</div>\n                <div class=\"seq-bad\"><b>✗ فشل</b>البريد مستخدم مسبقًا ← خطأ 422</div>\n              </div>\n            </div><div class=\"seq-card\">\n              <h3>2) تسجيل الدخول (Login)</h3>\n              <div class=\"seq-pipe\">\n      <span class=\"seq-chip\">User</span><span class=\"seq-arrow\">→</span>\n      <span class=\"seq-chip\">Frontend</span><span class=\"seq-arrow\">→</span>\n      <span class=\"seq-chip be\">Backend</span><span class=\"seq-arrow\">→</span>\n      <span class=\"seq-chip db\">Database</span>\n    </div>\n              <div class=\"seq-outcomes\">\n                <div class=\"seq-ok\"><b>✓ نجاح</b>بيانات صحيحة ← لوحة الدور (200 + Token)</div>\n                <div class=\"seq-bad\"><b>✗ فشل</b>بيانات خاطئة أو حساب معطّل ← 401/403</div>\n              </div>\n            </div><div class=\"seq-card\">\n              <h3>3) استعادة كلمة المرور</h3>\n              <div class=\"seq-pipe\">\n      <span class=\"seq-chip\">User</span><span class=\"seq-arrow\">→</span>\n      <span class=\"seq-chip\">Frontend</span><span class=\"seq-arrow\">→</span>\n      <span class=\"seq-chip be\">Backend</span><span class=\"seq-arrow\">→</span>\n      <span class=\"seq-chip db\">Database</span>\n    </div>\n              <div class=\"seq-outcomes\">\n                <div class=\"seq-ok\"><b>✓ نجاح</b>رابط آمن بالبريد ← تعيين كلمة جديدة</div>\n                <div class=\"seq-bad\"><b>✗ فشل</b>البريد غير موجود ← رسالة فشل</div>\n              </div>\n            </div><div class=\"seq-card\">\n              <h3>4) تحديث الملف الطبي</h3>\n              <div class=\"seq-pipe\">\n      <span class=\"seq-chip\">User</span><span class=\"seq-arrow\">→</span>\n      <span class=\"seq-chip\">Frontend</span><span class=\"seq-arrow\">→</span>\n      <span class=\"seq-chip be\">Backend</span><span class=\"seq-arrow\">→</span>\n      <span class=\"seq-chip db\">Database</span>\n    </div>\n              <div class=\"seq-outcomes\">\n                <div class=\"seq-ok\"><b>✓ نجاح</b>جلب البيانات ← حفظ التعديل بنجاح</div>\n                <div class=\"seq-bad\"><b>✗ فشل</b>بيانات غير صالحة ← خطأ 422</div>\n              </div>\n            </div><div class=\"seq-card\">\n              <h3>5) إنشاء استشارة</h3>\n              <div class=\"seq-pipe\">\n      <span class=\"seq-chip\">User</span><span class=\"seq-arrow\">→</span>\n      <span class=\"seq-chip\">Frontend</span><span class=\"seq-arrow\">→</span>\n      <span class=\"seq-chip be\">Backend</span><span class=\"seq-arrow\">→</span>\n      <span class=\"seq-chip db\">Database</span>\n    </div>\n              <div class=\"seq-outcomes\">\n                <div class=\"seq-ok\"><b>✓ نجاح</b>عامة أو موجهة + مرفقات ← Pending</div>\n                <div class=\"seq-bad\"><b>✗ فشل</b>سؤال ناقص / طبيب غير محدد ← خطأ تحقق</div>\n              </div>\n            </div><div class=\"seq-card\">\n              <h3>6) رد الطبيب</h3>\n              <div class=\"seq-pipe\">\n      <span class=\"seq-chip\">User</span><span class=\"seq-arrow\">→</span>\n      <span class=\"seq-chip\">Frontend</span><span class=\"seq-arrow\">→</span>\n      <span class=\"seq-chip be\">Backend</span><span class=\"seq-arrow\">→</span>\n      <span class=\"seq-chip db\">Database</span>\n    </div>\n              <div class=\"seq-outcomes\">\n                <div class=\"seq-ok\"><b>✓ نجاح</b>استلام الحالة ← رد + Mild/Moderate/Critical</div>\n                <div class=\"seq-bad\"><b>✗ فشل</b>حالة مستلمة مسبقًا أو نقص التصنيف ← خطأ</div>\n              </div>\n            </div><div class=\"seq-card\">\n              <h3>7) تسجيل الخروج (Logout)</h3>\n              <div class=\"seq-pipe\">\n      <span class=\"seq-chip\">User</span><span class=\"seq-arrow\">→</span>\n      <span class=\"seq-chip\">Frontend</span><span class=\"seq-arrow\">→</span>\n      <span class=\"seq-chip be\">Backend</span><span class=\"seq-arrow\">→</span>\n      <span class=\"seq-chip db\">Database</span>\n    </div>\n              <div class=\"seq-outcomes\">\n                <div class=\"seq-ok\"><b>✓ نجاح</b>حذف الـ Token ← العودة لصفحة Login</div>\n                <div class=\"seq-bad\"><b>✗ فشل</b>لا مسار فشل رئيسي (Not Applicable)</div>\n              </div>\n            </div></div></div>","en": "<div class=\"seq-board\">\n    <div class=\"seq-layers\">\n      <div class=\"seq-layer fe\">Frontend (React/Next.js)<b>User interface</b></div>\n      <div class=\"seq-layer be\">Backend (Laravel API)<b>Business logic & auth</b></div>\n      <div class=\"seq-layer db\">Database (MySQL)<b>Data & token storage</b></div>\n    </div>\n    <div class=\"seq-grid\"><div class=\"seq-card\">\n              <h3>1) Register</h3>\n              <div class=\"seq-pipe\">\n      <span class=\"seq-chip\">User</span><span class=\"seq-arrow\">→</span>\n      <span class=\"seq-chip\">Frontend</span><span class=\"seq-arrow\">→</span>\n      <span class=\"seq-chip be\">Backend</span><span class=\"seq-arrow\">→</span>\n      <span class=\"seq-chip db\">Database</span>\n    </div>\n              <div class=\"seq-outcomes\">\n                <div class=\"seq-ok\"><b>✓ Success</b>Account created + auto login (201 + Token)</div>\n                <div class=\"seq-bad\"><b>✗ Failure</b>Email already used → 422</div>\n              </div>\n            </div><div class=\"seq-card\">\n              <h3>2) Login</h3>\n              <div class=\"seq-pipe\">\n      <span class=\"seq-chip\">User</span><span class=\"seq-arrow\">→</span>\n      <span class=\"seq-chip\">Frontend</span><span class=\"seq-arrow\">→</span>\n      <span class=\"seq-chip be\">Backend</span><span class=\"seq-arrow\">→</span>\n      <span class=\"seq-chip db\">Database</span>\n    </div>\n              <div class=\"seq-outcomes\">\n                <div class=\"seq-ok\"><b>✓ Success</b>Valid credentials → role dashboard</div>\n                <div class=\"seq-bad\"><b>✗ Failure</b>Wrong data or disabled → 401/403</div>\n              </div>\n            </div><div class=\"seq-card\">\n              <h3>3) Reset Password</h3>\n              <div class=\"seq-pipe\">\n      <span class=\"seq-chip\">User</span><span class=\"seq-arrow\">→</span>\n      <span class=\"seq-chip\">Frontend</span><span class=\"seq-arrow\">→</span>\n      <span class=\"seq-chip be\">Backend</span><span class=\"seq-arrow\">→</span>\n      <span class=\"seq-chip db\">Database</span>\n    </div>\n              <div class=\"seq-outcomes\">\n                <div class=\"seq-ok\"><b>✓ Success</b>Secure email link → set new password</div>\n                <div class=\"seq-bad\"><b>✗ Failure</b>Email not found → failure message</div>\n              </div>\n            </div><div class=\"seq-card\">\n              <h3>4) Edit Medical Profile</h3>\n              <div class=\"seq-pipe\">\n      <span class=\"seq-chip\">User</span><span class=\"seq-arrow\">→</span>\n      <span class=\"seq-chip\">Frontend</span><span class=\"seq-arrow\">→</span>\n      <span class=\"seq-chip be\">Backend</span><span class=\"seq-arrow\">→</span>\n      <span class=\"seq-chip db\">Database</span>\n    </div>\n              <div class=\"seq-outcomes\">\n                <div class=\"seq-ok\"><b>✓ Success</b>Load profile → save updates successfully</div>\n                <div class=\"seq-bad\"><b>✗ Failure</b>Invalid data → 422</div>\n              </div>\n            </div><div class=\"seq-card\">\n              <h3>5) Create Consultation</h3>\n              <div class=\"seq-pipe\">\n      <span class=\"seq-chip\">User</span><span class=\"seq-arrow\">→</span>\n      <span class=\"seq-chip\">Frontend</span><span class=\"seq-arrow\">→</span>\n      <span class=\"seq-chip be\">Backend</span><span class=\"seq-arrow\">→</span>\n      <span class=\"seq-chip db\">Database</span>\n    </div>\n              <div class=\"seq-outcomes\">\n                <div class=\"seq-ok\"><b>✓ Success</b>General or directed + files → Pending</div>\n                <div class=\"seq-bad\"><b>✗ Failure</b>Short question / missing physician → validation error</div>\n              </div>\n            </div><div class=\"seq-card\">\n              <h3>6) Physician Responds</h3>\n              <div class=\"seq-pipe\">\n      <span class=\"seq-chip\">User</span><span class=\"seq-arrow\">→</span>\n      <span class=\"seq-chip\">Frontend</span><span class=\"seq-arrow\">→</span>\n      <span class=\"seq-chip be\">Backend</span><span class=\"seq-arrow\">→</span>\n      <span class=\"seq-chip db\">Database</span>\n    </div>\n              <div class=\"seq-outcomes\">\n                <div class=\"seq-ok\"><b>✓ Success</b>Claim case → reply + severity</div>\n                <div class=\"seq-bad\"><b>✗ Failure</b>Already claimed / missing severity → error</div>\n              </div>\n            </div><div class=\"seq-card\">\n              <h3>7) Logout</h3>\n              <div class=\"seq-pipe\">\n      <span class=\"seq-chip\">User</span><span class=\"seq-arrow\">→</span>\n      <span class=\"seq-chip\">Frontend</sp ": ""},"summary_points": {"ar": [],"en": []},"bullets": {"ar": ["User هو الصنف الأساسي لثلاثة أدوار: Patient و Physician و Admin","Consultation ترتبط بالملفات الطبية (Medical Files) ورسائل المتابعة (Follow-up Messages)","أحداث الاستشارة تولّد Notifications: إسناد الحالة، رد الطبيب، ورسالة متابعة","شدة الحالة (Case Severity): Mild (بسيطة) / Moderate (متوسطة) / Critical (حرجة)","وضع الإسناد (Assignment Mode): استشارة عامة أو استشارة موجهة لطبيب محدد","هذا المخطط يمهّد مباشرة لجداول MySQL في التنفيذ"],"en": ["User is the base class for Patient, Physician, and Admin","Consultation links to medical files and follow-up messages","Consultation events create notifications: case assignment, physician reply, and follow-up message","Severity: Mild / Moderate / Critical","Assignment mode: general or physician-directed consultation","This diagram leads directly to MySQL tables in implementation"]},"images": [{"src": "presentation-assets/media/image36.jpeg","caption_ar": "مخطط الأصناف","caption_en": "Class diagram"}],"table": null,"note": {"ar": "","en": ""},"timing": "0:50"},{"id": "ch6","chapter": 6,"kind": "section","title": {"ar": "الفصل السادس — التنفيذ","en": "Chapter 6 — Implementation"},"subtitle": {"ar": "","en": ""},"summary": {"ar": "","en": ""},"summary_points": {"ar": ["يبيّن الفصل تنفيذ التصميم على منصة ويب فعلية تعمل بالكامل","المعمارية ثلاثية الطبقات (Three-Tier): Frontend و Laravel Backend و MySQL","وتُنفَّذ عبر Modules وظيفية، مع عرض واجهات كل دور"],"en": ["This chapter shows the design implemented as a fully working web platform","Three-tier architecture: frontend, Laravel server, and MySQL database","Implemented through functional modules, with each role’s interfaces shown"]},"bullets": {"ar": [],"en": []},"images": [],"table": null,"note": {"ar": "","en": ""},"timing": "0:20"},{"id": "ch6-arch","chapter": 6,"kind": "content","title": {"ar": "كيف بُني النظام؟","en": "How Was the System Built?"},"subtitle": {"ar": "","en": ""},"summary": {"ar": "","en": ""},"su رور","caption_en": "Password recovery"}],"table": null,"note": {"ar": "","en": ""},"timing": "0:50"},{"id": "ch6-ui-patient","chapter": 6,"kind": "gallery","title": {"ar": "واجهات المريض","en": "Patient Interfaces"},"subtitle": {"ar": "","en": ""},"summary": {"ar": "","en": ""},"summary_points": {"ar": ["لوحة المريض (Patient Dashboard)","الملف الطبي (Medical Profile)","إنشاء استشارة (Create Consultation)","تفاصيل الاستشارة","الإشعارات والمتابعة (Notifications / Follow-up)"],"en": ["Patient dashboard","Medical profile","Create consultation","Consultation details","Notifications and follow-up"]},"bullets": {"ar": [],"en": []},"images": [{"src": "presentation-assets/media/image62.png","caption_ar": "لوحة المريض","caption_en": "Patient dashboard"},{"src": "presentation-assets/media/image43.jpeg","caption_ar": "الملف الطبي","caption_en": "Medical profile"},{"src": "presentation-assets/media/image46.jpeg","caption_ar": "إنشاء استشارة","caption_en": "Create consultation"},{"src": "presentation-assets/media/image47.jpeg","caption_ar": "تفاصيل الاستشارة","caption_en": "Consultation details"},{"src": "presentation-assets/media/image49.jpeg","caption_ar": "الإشعارات والمتابعة","caption_en": "Notifications"}],"table": null,"note": {"ar": "","en": ""},"timing": "1:00"},{"id": "ch6-ui-doc","chapter": 6,"kind": "gallery","title": {"ar": "واجهات الطبيب والمسؤول","en": "Physician and Admin Interfaces"},"subtitle": {"ar": "","en": ""},"summary": {"ar": "","en": ""},"summary_points": {"ar": ["لوحة الطبيب (Physician Dashboard)","استلام حالة والرد عليها","لوحة المسؤول (Admin Dashboard)","إدارة المستخدمين وتوثيق الأطباء"],"en": ["Physician dashboard","Take a case and reply","Admin dashboard","Manage users and verify physicians"]},"bullets": {"ar": [],"en": []},"images": [{"src": "presentation-assets/media/image59.png","caption_ar": "لوحة الطبيب","caption_en": "Physician dashboard"},{"src": "presentation-assets/media/image51.jpeg","caption_ar": "استلام حالة والرد","caption_en": "Claim and reply"},{"src": "presentation-assets/media/image58.png","caption_ar": "لوحة المسؤول","caption_en": "Admin dashboard"},{"src": "presentation-assets/media/image57.png","caption_ar": "إدارة المستخدمين والتوثيق","caption_en": "Users and verification"}],"table": null,"note": {"ar": "","en": ""},"timing": "1:00"},{"id": "ch7","chapter": 7,"kind": "section","title": {"ar": "الفصل السابع — الاختبار","en": "Chapter 7 — Testing"},"subtitle": {"ar": "","en": ""},"summary": {"ar": "","en": ""},"summary_points": {"ar": ["رافق الاختبار كل زيادة تطوير (Increment) ولم يُترك للنهاية","أربعة مستويات: Unit Testing و Integration Testing و Usability Testing و Security Testing","أثبتت النتائج أن النظام يعمل بموثوقية ويحمي البيانات الطبية"],"en": ["Testing accompanied every increment, not left to the end","Four levels: unit, integration, usability, security","Result: the system works reliably and protects medical data"]},"bullets": {"ar": [],"en": []},"images": [],"table": null,"note": {"ar": "","en": ""},"timing": "0:20"},{"id": "ch7-unit","chapter": 7,"kind": "content","title": {"ar": "اختبار الوحدة (Unit Testing)","en": "Unit Testing"},"subtitle": {"ar": "","en": ""},"summary": {"ar": "","en": ""},"summary_points": {"ar": [],"en": []},"bullets": {"ar": ["استُخدم PHPUnit داخل Laravel","اختبار التسجيل والتحقق من البيانات (Validation)","اختبار الـ Token: الطلب بلا Token يُرفض","اختبار الملف الطبي","اختبار إنشاء الاستشارة: رفض الوصف القصير جدًا، والحالة الابتدائية Pending","اختبار رد الطبيب: فقط الطبيب المسند يمكنه الرد، ثم تتحول الحالة إلى Completed"],"en": ["PHPUnit was used inside Laravel","Registration and validation tests","Token tests: requests without a token are rejected","Medical-profile tests","Consult creation: reject too-short descriptions; initial state Pending","Physician reply: only assigned physician can reply; then state becomes Completed"]},"images": [],"table": null,"note": {"ar": "","en": ""},"timing": "1:00"},{"id": "ch7-integration","chapter": 7,"kind": "content","ti {"id": "thanks","chapter": null,"kind": "hero","title": {"ar": "شكرًا لحسن استماعكم","en": "Thank You"},"subtitle": {"ar": "GazaCare Connect — منصة استشارات طبية عن بُعد آمنة ومنظمة","en": "GazaCare Connect — a secure structured remote consultation platform"},"summary": {"ar": "","en": ""},"summary_points": {"ar": ["شكرًا لحسن استماعكم","نرحّب بأسئلتكم"],"en": ["Thank you for listening","We welcome your questions"]},"bullets": {"ar": [],"en": []},"images": [{"src": "presentation-assets/media/image63.png?v=20260804a","caption_ar": "الواجهة الرئيسية","caption_en": "Home interface"}],"table": null,"note": {"ar": "","en": ""},"timing": "0:30"}];
let lang = 'ar';
let idx = 0;
const stage = document.getElementById('stage');
const prog = document.getElementById('prog');
const bar = document.getElementById('bar');
const rail = document.getElementById('rail');
const toast = document.getElementById('toast');
const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightboxImg');

function t(obj){ return (obj && (obj[lang] || obj.ar || '')) || ''; }
function showToast(msg){ toast.textContent = msg; toast.classList.add('show'); setTimeout(()=>toast.classList.remove('show'), 2000); }

function renderRail(){
  const chapters = [...new Set(SLIDES.map(s=>s.chapter).filter(Boolean))];
  rail.innerHTML = chapters.map(c=>{
    const first = SLIDES.findIndex(s=>s.chapter===c);
    const on = SLIDES[idx].chapter===c ? 'on' : '';
    const label = lang==='ar' ? (`الفصل ${c}`) : (`Ch ${c}`);
    return `<button class="chip ${on}" type="button" data-i="${first}">${label}</button>`;
  }).join('');
  rail.querySelectorAll('.chip').forEach(b=>b.onclick=()=>go(+b.dataset.i));
}

function updateNavLabels(){
  const prevLabel = document.getElementById('prevLabel');
  const nextLabel = document.getElementById('nextLabel');
  const prevArrow = document.getElementById('prevArrow');
  const nextArrow = document.getElementById('nextArrow');
  if(lang==='ar'){
    prevLabel.textContent = 'السابق';
    nextLabel.textContent = 'التالي';
    prevArrow.textContent = '→';
    nextArrow.textContent = '←';
  } else {
    prevLabel.textContent = 'Prev';
    nextLabel.textContent = 'Next';
    prevArrow.textContent = '←';
    nextArrow.textContent = '→';
  }
}

function shot(im){
  return `<figure class="shot" data-full="${im.src}">
    <div class="img-box"><img src="${im.src}" alt="${im['caption_'+lang]||''}" loading="lazy" /></div>
    <figcaption class="caption">${im['caption_'+lang]||''}</figcaption>
  </figure>`;
}

function render(){
  document.documentElement.lang = lang;
  document.documentElement.dir = lang==='ar' ? 'rtl' : 'ltr';
  document.body.classList.toggle('en', lang==='en');
  document.getElementById('btnAr').classList.toggle('active', lang==='ar');
  document.getElementById('btnEn').classList.toggle('active', lang==='en');
  document.getElementById('brandSub').textContent = lang==='ar'
    ? 'مشروع تخرج · هندسة البرمجيات'
    : 'Graduation Project · Software Engineering';
  document.getElementById('btnFs').textContent = lang==='ar' ? 'ملء الشاشة' : 'Fullscreen';
  document.getElementById('btnPptx').textContent = lang==='ar' ? 'تصدير PPTX' : 'Export PPTX AR';
  document.getElementById('btnPptxEn').textContent = lang==='ar' ? 'PPTX إنجليزي' : 'Export PPTX EN';

  const s = SLIDES[idx];
  const bullets = (s.bullets && s.bullets[lang]) || [];
  const imgs = s.images || [];
  const hasTable = !!s.table;
  const hasBullets = bullets.length > 0;
  const hasImgs = imgs.length > 0;
  const summary = t(s.summary);
  const subtitle = t(s.subtitle);
  const note = t(s.note);

  let body = '';
  const summaryPoints = ((s.summary_points && s.summary_points[lang]) || []).filter(Boolean);
  const leadBlock = summary
    ? `<div class="lead">${summary}</div>`
    : '';
  const noteTop = note ? `<div class="note">${note}</div>` : '';
  const summaryBlock = summaryPoints.length ? `
      <div class="summary-box">
        <div class="summary-points">
          ${summaryPoints.map((b,i)=>`<div class="summary-point"><div class="n">${i+1}</div><p>${b}</p></div>`).join('')}
        </div>
      </div>` : '';

  if(s.kind === 'section'){
    body = `
      ${summaryBlock}
      ${subtitle ? `<div class="section-sub">${subtitle}</div>` : ''}
      ${hasImgs ? `<div class="gallery g1">${shot(imgs[0])}</div>` : ''}`;
  } else {
    let left = '';
    if(leadBlock) left += leadBlock;
    // Keep short notes on top; long/shared notes go under tables for readability.
    if(noteTop && !hasTable) left += noteTop;
    if(summaryBlock) left += summaryBlock;
    if(hasBullets){
      left += `<div class="bullets">${bullets.map((b,i)=>`<div class="bullet"><div class="num">${i+1}</div><p>${b}</p></div>`).join('')}</div>`;
    }
    const diagram = (s.diagram && (s.diagram[lang] || s.diagram.ar)) || '';
    if(diagram){
      left += diagram;
    }
    if(hasTable){
      const headers = s.table['headers_'+lang] || s.table.headers_ar;
      const rows = s.table['rows_'+lang] || s.table.rows_ar;
      left += `<div class="table-wrap" style="margin-top:${hasBullets||summary||summaryPoints.length?'12px':'0'}"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
      if(note) left += `<div class="note bottom">${note}</div>`;
    }
    let right = '';
    if(hasImgs){
      const gClass = imgs.length <= 5 ? ('g' + Math.max(imgs.length,1)) : 'g-many';
      const gal = `<div class="gallery ${gClass}" style="margin-top:${hasTable||hasBullets||summaryPoints.length||summary||note?'14px':'0'}">${imgs.map(shot).join('')}</div>`;
      // Single detailed images need full width — a side column is too narrow to read.
      if(imgs.length === 1 || imgs.length >= 3){
        left += gal;
      } else {
        right = gal;
      }
    }
    const layoutClass = (!right ? 'solo' : (s.kind==='gallery' && !hasBullets && !hasTable ? 'gallery-only' : ''));
    body = `<div class="layout ${layoutClass}"><div>${left}</div>${right?`<div>${right}</div>`:''}</div>`;
  }

  const kicker = s.chapter
    ? (lang==='ar' ? `الفصل ${s.chapter}` : `Chapter ${s.chapter}`)
    : 'GazaCare Connect';

  stage.innerHTML = `<section class="slide active ${s.kind==='section'||s.kind==='hero'?'section-slide':''}">
    <div class="slide-inner">
      <div class="kicker">${kicker}</div>
      <h2 class="slide-title">${t(s.title)}</h2>
      ${subtitle && s.kind!=='section' ? `<div class="section-sub">${subtitle}</div>` : ''}
      ${body}
    </div>
  </section>`;

  stage.querySelectorAll('.shot').forEach(fig=>{
    fig.addEventListener('click', ()=> openLightbox(fig.dataset.full));
  });

  prog.textContent = lang==='ar' ? `الشريحة ${idx+1} من ${SLIDES.length}` : `Slide ${idx+1} of ${SLIDES.length}`;
  updateNavLabels();
  bar.style.width = `${((idx+1)/SLIDES.length)*100}%`;
  renderRail();
  // reset scroll to top of new slide
  const slideEl = stage.querySelector('.slide');
  if(slideEl) slideEl.scrollTop = 0;
}

function go(i){ idx = Math.max(0, Math.min(SLIDES.length-1, i)); render(); }
function next(){ go(idx+1); }
function prev(){ go(idx-1); }

document.getElementById('next').onclick = next;
document.getElementById('prev').onclick = prev;
document.getElementById('btnAr').onclick = ()=>{ lang='ar'; render(); };
document.getElementById('btnEn').onclick = ()=>{ lang='en'; render(); };
document.getElementById('btnFs').onclick = ()=>{
  if(!document.fullscreenElement) document.documentElement.requestFullscreen();
  else document.exitFullscreen();
};

let lbScale = 1, lbFit = 1, lbX = 0, lbY = 0, lbDragging = false, lbLastX = 0, lbLastY = 0;
const lbStage = document.getElementById('lbStage');
const lbZoomLabel = document.getElementById('lbZoomLabel');
const lbClose = document.getElementById('lbClose');
const lbZoomIn = document.getElementById('lbZoomIn');
const lbZoomOut = document.getElementById('lbZoomOut');
const lbZoomReset = document.getElementById('lbZoomReset');

function lbMaxScale(){
  // Allow zoom at least to native resolution, and a bit beyond.
  return Math.min(8, Math.max(4, 1 / Math.max(lbFit, 0.05)));
}
function applyLbTransform(){
  const nw = lightboxImg.naturalWidth || 1;
  const displayW = Math.max(1, nw * lbFit * lbScale);
  lightboxImg.style.width = displayW + 'px';
  lightboxImg.style.height = 'auto';
  lightboxImg.style.transform = `translate(${lbX}px, ${lbY}px)`;
  lbZoomLabel.textContent = Math.round(lbScale * 100) + '%';
  lightboxImg.style.cursor = lbScale > 1 ? (lbDragging ? 'grabbing' : 'grab') : 'zoom-in';
}
function resetLbZoom(){
  lbScale = 1; lbX = 0; lbY = 0; lbDragging = false;
  applyLbTransform();
}
function computeLbFit(){
  const nw = lightboxImg.naturalWidth;
  const nh = lightboxImg.naturalHeight;
  if(!nw || !nh) return 1;
  const rect = lbStage.getBoundingClientRect();
  const pad = 28;
  return Math.min((rect.width - pad) / nw, (rect.height - pad) / nh, 1);
}
function prepareLightboxImage(){
  lbFit = computeLbFit();
  resetLbZoom();
}
function openLightbox(src){
  lightbox.classList.add('show');
  lightbox.setAttribute('aria-hidden', 'false');
  lightboxImg.onload = prepareLightboxImage;
  if(lightboxImg.getAttribute('src') === src && lightboxImg.complete && lightboxImg.naturalWidth){
    prepareLightboxImage();
  } else {
    lightboxImg.src = src;
  }
}
function closeLightbox(){
  lightbox.classList.remove('show');
  lightbox.setAttribute('aria-hidden', 'true');
  resetLbZoom();
}
function zoomBy(delta, cx, cy){
  const prev = lbScale;
  lbScale = Math.min(lbMaxScale(), Math.max(1, +(lbScale + delta).toFixed(2)));
  if(lbScale === 1){ lbX = 0; lbY = 0; }
  else if(typeof cx === 'number' && typeof cy === 'number'){
    const rect = lightboxImg.getBoundingClientRect();
    const ox = cx - (rect.left + rect.width / 2);
    const oy = cy - (rect.top + rect.height / 2);
    lbX -= ox * (lbScale / prev - 1);
    lbY -= oy * (lbScale / prev - 1);
  }
  applyLbTransform();
}

lbZoomIn.onclick = (e)=>{ e.stopPropagation(); zoomBy(0.25); };
lbZoomOut.onclick = (e)=>{ e.stopPropagation(); zoomBy(-0.25); };
lbZoomReset.onclick = (e)=>{ e.stopPropagation(); resetLbZoom(); };
lbClose.onclick = (e)=>{ e.stopPropagation(); closeLightbox(); };

lightbox.addEventListener('click', (e)=>{
  if(e.target === lightbox || e.target === lbStage) closeLightbox();
});
lightboxImg.addEventListener('click', (e)=> e.stopPropagation());
lightboxImg.addEventListener('dblclick', (e)=>{
  e.stopPropagation();
  if(lbScale === 1) zoomBy(1, e.clientX, e.clientY);
  else resetLbZoom();
});
lightbox.addEventListener('wheel', (e)=>{
  if(!lightbox.classList.contains('show')) return;
  e.preventDefault();
  zoomBy(e.deltaY < 0 ? 0.2 : -0.2, e.clientX, e.clientY);
}, {passive:false});

lightboxImg.addEventListener('pointerdown', (e)=>{
  if(lbScale <= 1) return;
  lbDragging = true;
  lbLastX = e.clientX; lbLastY = e.clientY;
  lightboxImg.classList.add('dragging');
  lightboxImg.setPointerCapture(e.pointerId);
});
lightboxImg.addEventListener('pointermove', (e)=>{
  if(!lbDragging) return;
  lbX += e.clientX - lbLastX;
  lbY += e.clientY - lbLastY;
  lbLastX = e.clientX; lbLastY = e.clientY;
  applyLbTransform();
});
lightboxImg.addEventListener('pointerup', ()=>{
  lbDragging = false;
  lightboxImg.classList.remove('dragging');
});
lightboxImg.addEventListener('pointercancel', ()=>{
  lbDragging = false;
  lightboxImg.classList.remove('dragging');
});


document.addEventListener('keydown', (e)=>{
  if(lightbox.classList.contains('show') && e.key!=='Escape'){
    if(e.key==='+' || e.key==='='){ zoomBy(0.25); return; }
    if(e.key==='-' || e.key==='_'){ zoomBy(-0.25); return; }
    if(e.key==='0'){ resetLbZoom(); return; }
    return;
  }
  const slideEl = stage.querySelector('.slide');
  // allow normal page-like scrolling with arrows only when not at edge? Keep Space/Page for slides.
  if(['PageDown','PageUp'].includes(e.key) || (e.key===' ' && !e.target.closest('input,textarea'))) e.preventDefault();
  if(lang==='ar'){
    if(e.key==='ArrowLeft' || e.key===' ' || e.key==='PageDown') next();
    if(e.key==='ArrowRight' || e.key==='PageUp') prev();
  } else {
    if(e.key==='ArrowRight' || e.key===' ' || e.key==='PageDown') next();
    if(e.key==='ArrowLeft' || e.key==='PageUp') prev();
  }
  if(e.key==='Escape'){ if(lightbox.classList.contains('show')) closeLightbox(); if(document.fullscreenElement) document.exitFullscreen(); }
  if(e.key.toLowerCase()==='e'){ lang='en'; render(); }
  if(e.key.toLowerCase()==='a'){ lang='ar'; render(); }
});

// wheel on stage should scroll the active slide, not get trapped
stage.addEventListener('wheel', (e)=>{
  const slideEl = stage.querySelector('.slide');
  if(!slideEl) return;
  // native overflow handles it; ensure focus
}, {passive:true});

render();
</script>
