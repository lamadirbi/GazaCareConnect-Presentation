ح المعلّقين  ·  2. مراجعة الطلب  ·  3. قبول/رفض  ·  4. تحديث وإشعار"],["Alternate Flow","رفض مع ذكر السبب وإشعار الطبيب"],["Postcondition","حالة التوثيق محدّثة والطبيب مُشعَر."]],"en":[["Use Case ID","UC-25 / RQ-25"],["Use Case Name","Approve/reject physician verification"],["Actors","Admin"],["Description","Review verification requests and notify the result."],["Precondition","At least one physician is pending."],["Basic Flow","1. Open pending  ·  2. Review request  ·  3. Approve/reject  ·  4. Update and notify"],["Alternate Flow","Reject with a reason and notify the physician"],["Postcondition","Verification status updated; physician notified."]]}},"note":{"ar":"باقي المسؤول باختصار: UC-23 إدارة المستخدمين · UC-24 تعطيل/تفعيل الحساب","en":"Other admin: UC-23 Manage users · UC-24 Disable/enable account"},"timing":"0:45"},{"id":"ch4-flow","chapter":4,"kind":"content","title":{"ar":"مسار الاستشارة: عامة وموجهة لطبيب محدد","en":"Consultation path: general and physician-directed"},"subtitle":{"ar":"خطوات مشتركة ثم تفرع شجري للمسارين، ثم التقاء للرد والمتابعة","en":"Shared steps, then a tree branch for both paths, then join for reply and follow-up"},"summary":{"ar":"","en":""},"summary_points":{"ar":[],"en":[]},"bullets":{"ar":[],"en":[]},"images":[],"table":null,"note":{"ar":"","en":""},"timing":"1:00","diagram":{"ar":"<div class=\"flow-map\">\n  <div class=\"flow-block\">\n    <div class=\"flow-label\">أولًا — خطوات مشتركة</div>\n    <div class=\"flow-shared\">\n      <div class=\"flow-node\">1) UC-11 / RQ-11 — تقديم الاستشارة النصية<br><span>المريض يكتب سؤاله الطبي ويختار نوع الإسناد: استشارة عامة أو موجهة لطبيب محدد، ثم يرسل الطلب.</span></div>\n      <div class=\"flow-arrow\">↓</div>\n      <div class=\"flow-node\">2) UC-12 / RQ-12 — رفع المرفقات الطبية<br><span>يمكن إرفاق صور أو PDF مع الاستشارة عند الحاجة لدعم التشخيص (اختياري).</span></div>\n      <div class=\"flow-arrow\">↓</div>\n      <div class=\"flow-node\">3) Pending — بانتظار الطبيب<br><span>تُحفظ الاستشارة بحالة معلّقة حتى يستلمها طبيب موثّق ويرد عليها.</span></div>\n    </div>\n  </div>\n\n  <div class=\"flow-fork\">تفرع حسب نوع الاستشارة</div>\n\n  <div class=\"flow-branches\">\n    <div class=\"flow-branch\">\n      <div class=\"flow-branch-title\">استشارة عامة</div>\n      <div class=\"flow-node accent\">UC-17 / RQ-17 — استلام استشارة عامة<br><span>تدخل الطلب قائمة مشتركة، وأي طبيب موثّق يستطيع استلامها والبدء بمعالجتها.</span></div>\n    </div>\n    <div class=\"flow-branch\">\n      <div class=\"flow-branch-title\">استشارة موجهة لطبيب محدد</div>\n      <div class=\"flow-node accent2\">بدون UC-17 — إسناد مباشر<br><span>المريض اختار طبيبًا بعينه من البداية، فيصل الطلب له مباشرة دون قائمة مشتركة.</span></div>\n    </div>\n  </div>\n\n  <div class=\"flow-join\">↓ يلتقي المساران هنا ↓</div>\n\n  <div class=\"flow-block\">\n    <div class=\"flow-shared\">\n      <div class=\"flow-node\">UC-20 / RQ-20 — إرسال الرد الطبي<br><span>الطبيب يكتب التوصية ويصنّف شدة الحالة: Mild (بسيطة) / Moderate (متوسطة) / Critical (حرجة)، ثم يُشعر المريض.</span></div>\n      <div class=\"flow-arrow\">↓</div>\n      <div class=\"flow-node\">UC-14 / RQ-14 + UC-21 / RQ-21 — المتابعة<br><span>بعد أول رد يمكن للمريض والطبيب مواصلة النقاش برسائل Follow-up داخل نفس الاستشارة.</span></div>\n    </div>\n  </div>\n</div>","en":"<div class=\"flow-map\">\n  <div class=\"flow-block\">\n    <div class=\"flow-label\">First — shared steps</div>\n    <div class=\"flow-shared\">\n      <div class=\"flow-node\">1) UC-11 / RQ-11 — Submit text consultation<br><span>The patient writes the medical question, chooses general or physician-directed assignment, then submits.</span></div>\n      <div class=\"flow-arrow\">↓</div>\n      <div class=\"flow-node\">2) UC-12 / RQ-12 — Upload medical attachments<br><span>Optional images or PDF can be attached to support diagnosis.</span></div>\n      <div class=\"flow-arrow\">↓</div>\n      <div class=\"flow-node\">3) Pending — awaiting physician<br><span>The consultation stays pending until a verified physician takes it and replies.</span></div>\n    </div>\n  </div>\n\n  <div class=\"flow-fork\">Branch by consultation type</div>\n\n  <div class=\"flow-branches\">\n    <div class=\"flow-branch\">\n      <div class=\"flow-branch-title\">General consultation</div>\n      <div class=\"flow-node accent\">UC-17 / RQ-17 — Take a general consult<br><span>The request enters a shared list; any verified physician can take it and start handling it.</span></div>\n    </div>\n    <div class=\"flow-branch\">\n      <div class=\"flow-branch-title\">Physician-directed</div>\n      <div class=\"flow-node accent2\">No UC-17 — direct assignment<br><span>The patient already chose a specific physician, so the request goes to that physician directly.</span></div>\n    </div>\n  </div>\n\n  <div class=\"flow-join\">↓ Paths meet again ↓</div>\n\n  <div class=\"flow-block\">\n    <div class=\"flow-shared\">\n      <div class=\"flow-node\">UC-20 / RQ-20 — Send medical reply<br><span>The physician writes the recommendation and sets severity: Mild / Moderate / Critical, then the patient is notified.</span></div>\n      <div class=\"flow-arrow\">↓</div>\n      <div class=\"flow-node\">UC-14 / RQ-14 + UC-21 / RQ-21 — Follow-up<br><span>After the first reply, patient and physician can continue with Follow-up messages in the same consult.</span></div>\n    </div>\n  </div>\n</div>"}},{"id":"ch4-verify","chapter":4,"kind":"content","title":{"ar":"قواعد التوثيق والصلاحيات","en":"Verification and Permission Rules"},"subtitle":{"ar":"تسلسل واضح من تسجيل الطبيب حتى التوثيق والصلاحيات","en":"A clear sequence from physician registration to verification and permissions"},"summary":{"ar":"","en":""},"summary_points":{"ar":[],"en":[]},"bullets":{"ar":["UC-15 / RQ-15 (تسجيل الطبيب) — الطبيب الجديد ينشئ حسابًا ويبقى في حالة Pending Verification (بانتظار التوثيق)","قبل اعتماد UC-25 / RQ-25 (قبول أو رفض توثيق الأطباء): الطبيب يرى اللوحة فقط، ولا يستخدم UC-17 / RQ-17 (استلام استشارة عامة) ولا UC-20 / RQ-20 (إرسال الرد الطبي)","UC-25 / RQ-25 (قبول التوثيق من الـ Admin) — بعد القبول تُفعَّل للطبيب صلاحيات الاستلام والرد","عند الرفض عبر UC-25 / RQ-25 (رفض التوثيق مع ذكر السبب): يمكن للطبيب إعادة التقديم لاحقًا","UC-24 / RQ-24 (تعطيل أو تفعيل الحساب) — تعطيل الحساب يمنع الدخول إلى الميزات المحمية"],"en":["UC-15 / RQ-15 (physician registration) — the new physician creates an account and stays Pending Verification","Before UC-25 / RQ-25 (approve or reject physician verification): the physician can see the dashboard only — no UC-17 / RQ-17 (take a general consult) and no UC-20 / RQ-20 (send medical reply)","UC-25 / RQ-25 (Admin approves verification) — after approval, take-case and reply permissions are enabled","If rejected via UC-25 / RQ-25 (reject verification with a reason): the physician can re-submit later","UC-24 / RQ-24 (disable or enable account) — disabling blocks access to protected features"]},"images":[],"table":null,"note":{"ar":"","en":""},"timing":"0:50"},{"id":"ch5","chapter":5,"kind":"section","title":{"ar":"الفصل الخامس — النمذجة والتصميم (UML)","en":"Chapter 5 — Modeling and Design"},"subtitle":{"ar":"","en":""},"summary":{"ar":"","en":""},"summary_points":{"ar":["وُضعت خريطة UML واضحة للنظام قبل مرحلة البرمجة","تشمل المخططات: Activity Diagram و Use Case Diagram و Sequence Diagram و Class Diagram","تشكّل هذه المخططات الأساس المباشر للتنفيذ"],"en":["UML maps were prepared before coding","Activity + use case + sequence + class diagrams","These diagrams are the basis for Chapter 6 implementation"]},"bullets":{"ar":[],"en":[]},"images":[],"table":null,"note":{"ar":"","en":""},"timing":"0:20"},{"id":"ch5-activity","chapter":5,"kind":"media","title":{"ar":"Activity Diagram و Use Case Diagram","en":"Activity and Use Case Diagrams"},"subtitle":{"ar":"","en":""},"summary":{"ar":"","en":""},"summary_points":{"ar":[],"en":[]},"bullets":{"ar":["Activity Diagram يوضح مسار الاستشارة من البداية إلى النهاية","يظهر تفرّع المسارات حسب الدور: P ister","Fill form; send data to server and DB","Account created; enter dashboard","Email already used → error"],["2) Login","Verify email and password","Go to role dashboard","Wrong data or disabled account"],["3) Reset password","Email link then new password","Password updated","Email not found → fail"],["4) Edit medical profile","Load data then save edits","Update success message","Invalid data → error"],["5) Create consultation","Question + general/directed + files","Saved as Pending","Short question or no physician → error"],["6) Physician reply","Take case then reply with severity","Reply with Mild / Moderate / Critical","Already taken or no severity → error"],["7) Logout","End session and remove token","Return to Login","No main failure path"]]}},"note":{"ar":"","en":""},"diagram":null,"timing":"1:20"},{"id":"ch5-seq-register","chapter":5,"kind":"gallery","title":{"ar":"مخطط التسلسل 1 — التسجيل (Register)","en":"Sequence 1 — Register"},"subtitle":{"ar":"الفصل 5 — القسم 5.3.1 — الشكل 26","en":"Chapter 5 — 5.3.1 — Figure 26"},"summary":{"ar":"","en":""},"summary_points":{"ar":["المستخدم يملأ نموذج مريض أو طبيب، والواجهة ترسل POST /api/v1/auth/register","نجاح: إنشاء الحساب + Sanctum token والدخول التلقائي للوحة","فشل: البريد مستخدم مسبقًا ← 422 ولا يُنشأ الحساب"],"en":["User fills patient/physician form; UI sends POST /api/v1/auth/register","Success: account created + Sanctum token and auto login","Failure: email already exists → 422, no account created"]},"bullets":{"ar":[],"en":[]},"images":[{"src":"presentation-assets/media/image29.jpeg?v=20260805k","caption_ar":"الشكل 26 — User Register","caption_en":"Figure 26 — User Register"}],"table":null,"note":{"ar":"","en":""},"timing":"0:35"},{"id":"ch5-seq-login","chapter":5,"kind":"gallery","title":{"ar":"مخطط التسلسل 2 — تسجيل الدخول (Login)","en":"Sequence 2 — Login"},"subtitle":{"ar":"الفصل 5 — القسم 5.3.2 — الشكل 27","en":"Chapter 5 — 5.3.2 — Figure 27"},"summary":{"ar":"","en":""},"summary_points":{"ar":["إدخال البريد وكلمة المرور عبر POST /api/v1/auth/login","نجاح: 200 مع token والانتقال للوحة حسب الدور","فشل: بيانات خاطئة أو حساب معطّل ← 401 / 403"],"en":["Email and password via POST /api/v1/auth/login","Success: 200 + token, go to role dashboard","Failure: wrong credentials or disabled account → 401 / 403"]},"bullets":{"ar":[],"en":[]},"images":[{"src":"presentation-assets/media/image30.jpeg?v=20260805k","caption_ar":"الشكل 27 — User Login","caption_en":"Figure 27 — User Login"}],"table":null,"note":{"ar":"","en":""},"timing":"0:35"},{"id":"ch5-seq-reset","chapter":5,"kind":"gallery","title":{"ar":"مخطط التسلسل 3 — استعادة كلمة المرور","en":"Sequence 3 — Reset Password"},"subtitle":{"ar":"الفصل 5 — القسم 5.3.3 — الشكل 28","en":"Chapter 5 — 5.3.3 — Figure 28"},"summary":{"ar":"","en":""},"summary_points":{"ar":["طلب رابط عبر البريد ثم تعيين كلمة جديدة برمز الاستعادة","نجاح: تحديث كلمة المرور المشفّرة والعودة لتسجيل الدخول","فشل: البريد غير موجود ← رسالة فشل"],"en":["Request email link then set a new password with the reset token","Success: hashed password updated, return to login","Failure: email not found"]},"bullets":{"ar":[],"en":[]},"images":[{"src":"presentation-assets/media/image31.jpeg?v=20260805k","caption_ar":"الشكل 28 — Reset Password","caption_en":"Figure 28 — Reset Password"}],"table":null,"note":{"ar":"","en":""},"timing":"0:35"},{"id":"ch5-seq-profile","chapter":5,"kind":"gallery","title":{"ar":"مخطط التسلسل 4 — تحديث الملف الطبي","en":"Sequence 4 — Edit Medical Profile"},"subtitle":{"ar":"الفصل 5 — القسم 5.3.4 — الشكل 29","en":"Chapter 5 — 5.3.4 — Figure 29"},"summary":{"ar":"","en":""},"summary_points":{"ar":["جلب الملف بـ GET ثم الحفظ بـ PUT /api/v1/medical-profile","نجاح: 200 مع الملف المحدَّث ورسالة نجاح","فشل: بيانات غير صالحة ← 422"],"en":["Load profile with GET then save with PUT /api/v1/medical-profile","Success: 200 with updated profile","Failure: invalid data → 422"]},"bullets":{"ar":[],"en":[]},"images":[{"src":"presentation-assets/media/image32.jpeg?v=20260805k","caption_ar":"الشكل 29 — Edit User Profile","caption_en":"Figure 29 — Edit User Profile"}],"table":null,"note":{"ar":"","en":""},"timing":"0:35"},{"id":"ch5-seq-consult","chapter":5,"kind":"gallery","title":{"ar":"مخطط التسلسل 5 — إنشاء استشارة","en":"Sequence 5 — Create Consultation"},"subtitle":{"ar":"الفصل 5 — القسم 5.3.5 — الشكل 30","en":"Chapter 5 — 5.3.5 — Figure 30"},"summary":{"ar":"","en":""},"summary_points":{"ar":["جلب الأطباء الموثّقين، اختيار عامة أو موجّهة، ورفع المرفقات اختياريًا","نجاح: حفظ الاستشارة Pending و201، مع إشعار الطبيب إن كانت موجّهة","هذا المخطط يغطي المسارين معًا داخل نفس العملية"],"en":["Load verified physicians, choose general or directed, optional files","Success: consultation saved as Pending (201); notify physician if directed","One diagram covers both assignment modes"]},"bullets":{"ar":[],"en":[]},"images":[{"src":"presentation-assets/media/image33.jpeg?v=20260805k","caption_ar":"الشكل 30 — Create Consultation","caption_en":"Figure 30 — Create Consultation"}],"table":null,"note":{"ar":"","en":""},"timing":"0:35"},{"id":"ch5-seq-reply","chapter":5,"kind":"gallery","title":{"ar":"مخطط التسلسل 6 — رد الطبيب","en":"Sequence 6 — Physician Responds"},"subtitle":{"ar":"الفصل 5 — القسم 5.3.6 — الشكل 31","en":"Chapter 5 — 5.3.6 — Figure 31"},"summary":{"ar":"","en":""},"summary_points":{"ar":["عرض الطابور ثم claim ثم respond مع تصنيف الشدة","نجاح: حفظ الرد وإشعار المريض","يشمل الاستلام والرد داخل مخطط واحد"],"en":["Open queue, claim, then respond with severity","Success: reply saved and patient notified","Claim + reply are in one diagram"]},"bullets":{"ar":[],"en":[]},"images":[{"src":"presentation-assets/media/image34.jpeg?v=20260805k","caption_ar":"الشكل 31 — Physician Responds","caption_en":"Figure 31 — Physician Responds"}],"table":null,"note":{"ar":"","en":""},"timing":"0:35"},{"id":"ch5-seq-logout","chapter":5,"kind":"gallery","title":{"ar":"مخطط التسلسل 7 — تسجيل الخروج (Logout)","en":"Sequence 7 — Logout"},"subt a secure structured remote consultation platform"},"summary":{"ar":"","en":""},"summary_points":{"ar":["شكرًا لحسن استماعكم","نرحّب بأسئلتكم"],"en":["Thank you for listening","We welcome your questions"]},"bullets":{"ar":[],"en":[]},"images":[],"table":null,"note":{"ar":"","en":""},"timing":"0:30"}];
let lang = 'ar';
let idx = 0;
const stage = document.getElementById('stage');
const prog = document.getElementById('prog');
const bar = document.getElementById('bar');
const rail = document.getElementById('rail');
const toast = document.getElementById('toast');
const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightboxImg');

function t(obj){ return (obj && (obj[lang] || obj.ar || '')) || ''; }
function showToast(msg){ toast.textContent = msg; toast.classList.add('show'); setTimeout(()=>toast.classList.remove('show'), 2000); }

function renderRail(){
  const chapters = [...new Set(SLIDES.map(s=>s.chapter).filter(Boolean))];
  rail.innerHTML = chapters.map(c=>{
    const first = SLIDES.findIndex(s=>s.chapter===c);
    const on = SLIDES[idx].chapter===c ? 'on' : '';
    const label = lang==='ar' ? (`الفصل ${c}`) : (`Ch ${c}`);
    return `<button class="chip ${on}" type="button" data-i="${first}">${label}</button>`;
  }).join('');
  rail.querySelectorAll('.chip').forEach(b=>b.onclick=()=>go(+b.dataset.i));
}

function updateNavLabels(){
  const prevLabel = document.getElementById('prevLabel');
  const nextLabel = document.getElementById('nextLabel');
  const prevArrow = document.getElementById('prevArrow');
  const nextArrow = document.getElementById('nextArrow');
  if(lang==='ar'){
    prevLabel.textContent = 'السابق';
    nextLabel.textContent = 'التالي';
    prevArrow.textContent = '→';
    nextArrow.textContent = '←';
  } else {
    prevLabel.textContent = 'Prev';
    nextLabel.textContent = 'Next';
    prevArrow.textContent = '←';
    nextArrow.textContent = '→';
  }
}

function shot(im){
  return `<figure class="shot" data-full="${im.src}">
    <div class="img-box"><img src="${im.src}" alt="${im['caption_'+lang]||''}" loading="lazy" /></div>
    <figcaption class="caption">${im['caption_'+lang]||''}</figcaption>
  </figure>`;
}

function render(){
  document.documentElement.lang = lang;
  document.documentElement.dir = lang==='ar' ? 'rtl' : 'ltr';
  document.body.classList.toggle('en', lang==='en');
  document.getElementById('btnAr').classList.toggle('active', lang==='ar');
  document.getElementById('btnEn').classList.toggle('active', lang==='en');
  document.getElementById('brandSub').textContent = lang==='ar'
    ? 'مشروع تخرج · هندسة البرمجيات'
    : 'Graduation Project · Software Engineering';
  document.getElementById('btnFs').textContent = lang==='ar' ? 'ملء الشاشة' : 'Fullscreen';
  document.getElementById('btnPptx').textContent = lang==='ar' ? 'تصدير PPTX' : 'Export PPTX AR';
  document.getElementById('btnPptxEn').textContent = lang==='ar' ? 'PPTX إنجليزي' : 'Export PPTX EN';

  const s = SLIDES[idx];
  const bullets = (s.bullets && s.bullets[lang]) || [];
  const imgs = s.images || [];
  const hasTable = !!s.table;
  const hasBullets = bullets.length > 0;
  const hasImgs = imgs.length > 0;
  const summary = t(s.summary);
  const subtitle = t(s.subtitle);
  const note = t(s.note);

  let body = '';
  const summaryPoints = ((s.summary_points && s.summary_points[lang]) || []).filter(Boolean);
  const leadBlock = summary
    ? `<div class="lead">${summary}</div>`
    : '';
  const noteTop = note ? `<div class="note">${note}</div>` : '';
  const summaryBlock = summaryPoints.length ? `
      <div class="summary-box">
        <div class="summary-points">
          ${summaryPoints.map((b,i)=>`<div class="summary-point"><div class="n">${i+1}</div><p>${b}</p></div>`).join('')}
        </div>
      </div>` : '';

  if(s.kind === 'hero'){
    body = `<div class="hero-wrap">
      ${subtitle ? `<p class="hero-lead">${subtitle}</p>` : ''}
      ${hasBullets ? `<div class="hero-meta">${bullets.map(b=>`<span class="hero-chip">${b}</span>`).join('')}</div>` : ''}
      ${summaryBlock}
    </div>`;
  } else if(s.kind === 'section'){
    body = `
      ${summaryBlock}
      ${subtitle ? `<div class="section-sub">${subtitle}</div>` : ''}
      ${hasImgs ? `<div class="gallery g1">${shot(imgs[0])}</div>` : ''}`;
  } else {
    let left = '';
    if(leadBlock) left += leadBlock;
    // Keep short notes on top; long/shared notes go under tables for readability.
    if(noteTop && !hasTable) left += noteTop;
    if(summaryBlock) left += summaryBlock;
    if(hasBullets){
      left += `<div class="bullets">${bullets.map((b,i)=>`<div class="bullet"><div class="num">${i+1}</div><p>${b}</p></div>`).join('')}</div>`;
    }
    const diagram = (s.diagram && (s.diagram[lang] || s.diagram.ar)) || '';
    if(diagram){
      left += diagram;
    }
    if(hasTable){
      const headers = (s.table.headers && (s.table.headers[lang] || s.table.headers.ar)) || s.table['headers_'+lang] || s.table.headers_ar || [];
      const rows = (s.table.rows && (s.table.rows[lang] || s.table.rows.ar)) || s.table['rows_'+lang] || s.table.rows_ar || [];
      left += `<div class="table-wrap" style="margin-top:${hasBullets||summary||summaryPoints.length?'12px':'0'}"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
      if(note) left += `<div class="note bottom">${note}</div>`;
    }
    let right = '';
    if(hasImgs){
      const gClass = imgs.length <= 5 ? ('g' + Math.max(imgs.length,1)) : 'g-many';
      const gal = `<div class="gallery ${gClass}" style="margin-top:${hasTable||hasBullets||summaryPoints.length||summary||note?'14px':'0'}">${imgs.map(shot).join('')}</div>`;
      // Single detailed images need full width — a side column is too narrow to read.
      if(imgs.length === 1 || imgs.length >= 3){
        left += gal;
      } else {
        right = gal;
      }
    }
    const layoutClass = (!right ? 'solo' : (s.kind==='gallery' && !hasBullets && !hasTable ? 'gallery-only' : ''));
    body = `<div class="layout ${layoutClass}"><div>${left}</div>${right?`<div>${right}</div>`:''}</div>`;
  }

  const kicker = s.chapter
    ? (lang==='ar' ? `الفصل ${s.chapter}` : `Chapter ${s.chapter}`)
    : 'GazaCare Connect';

  stage.innerHTML = `<section class="slide active kind-${s.kind}">
    <div class="slide-bg" aria-hidden="true"></div>
    <div class="slide-inner">
      <div class="kicker-row"><span class="kicker">${kicker}</span><span class="kicker-line"></span></div>
      <h2 class="slide-title">${t(s.title)}</h2>
      ${subtitle && s.kind!=='section' && s.kind!=='hero' ? `<div class="section-sub">${subtitle}</div>` : ''}
      ${body}
    </div>
  </section>`;

  stage.querySelectorAll('.shot').forEach(fig=>{
    fig.addEventListener('click', ()=> openLightbox(fig.dataset.full));
  });

  prog.textContent = lang==='ar' ? `الشريحة ${idx+1} من ${SLIDES.length}` : `Slide ${idx+1} of ${SLIDES.length}`;
  updateNavLabels();
  bar.style.width = `${((idx+1)/SLIDES.length)*100}%`;
  renderRail();
  // reset scroll to top of new slide
  const slideEl = stage.querySelector('.slide');
  if(slideEl) slideEl.scrollTop = 0;
}

function go(i){ idx = Math.max(0, Math.min(SLIDES.length-1, i)); render(); }
function next(){ go(idx+1); }
function prev(){ go(idx-1); }

document.getElementById('next').onclick = next;
document.getElementById('prev').onclick = prev;
document.getElementById('btnAr').onclick = ()=>{ lang='ar'; render(); };
document.getElementById('btnEn').onclick = ()=>{ lang='en'; render(); };
document.getElementById('btnFs').onclick = ()=>{
  if(!document.fullscreenElement) document.documentElement.requestFullscreen();
  else document.exitFullscreen();
};

let lbScale = 1, lbFit = 1, lbX = 0, lbY = 0, lbDragging = false, lbLastX = 0, lbLastY = 0;
const lbStage = document.getElementById('lbStage');
const lbZoomLabel = document.getElementById('lbZoomLabel');
const lbClose = document.getElementById('lbClose');
const lbZoomIn = document.getElementById('lbZoomIn');
const lbZoomOut = document.getElementById('lbZoomOut');
const lbZoomReset = document.getElementById('lbZoomReset');

function lbMaxScale(){
  // Allow zoom at least to native resolution, and a bit beyond.
  return Math.min(8, Math.max(4, 1 / Math.max(lbFit, 0.05)));
}
function applyLbTransform(){
  const nw = lightboxImg.naturalWidth || 1;
  const displayW = Math.max(1, nw * lbFit * lbScale);
  lightboxImg.style.width = displayW + 'px';
  lightboxImg.style.height = 'auto';
  lightboxImg.style.transform = `translate(${lbX}px, ${lbY}px)`;
  lbZoomLabel.textContent = Math.round(lbScale * 100) + '%';
  lightboxImg.style.cursor = lbScale > 1 ? (lbDragging ? 'grabbing' : 'grab') : 'zoom-in';
}
function resetLbZoom(){
  lbScale = 1; lbX = 0; lbY = 0; lbDragging = false;
  applyLbTransform();
}
function computeLbFit(){
  const nw = lightboxImg.naturalWidth;
  const nh = lightboxImg.naturalHeight;
  if(!nw || !nh) return 1;
  const rect = lbStage.getBoundingClientRect();
  const pad = 28;
  return Math.min((rect.width - pad) / nw, (rect.height - pad) / nh, 1);
}
function prepareLightboxImage(){
  lbFit = computeLbFit();
  resetLbZoom();
}
function openLightbox(src){
  lightbox.classList.add('show');
  lightbox.setAttribute('aria-hidden', 'false');
  lightboxImg.onload = prepareLightboxImage;
  if(lightboxImg.getAttribute('src') === src && lightboxImg.complete && lightboxImg.naturalWidth){
    prepareLightboxImage();
  } else {
    lightboxImg.src = src;
  }
}
function closeLightbox(){
  lightbox.classList.remove('show');
  lightbox.setAttribute('aria-hidden', 'true');
  resetLbZoom();
}
function zoomBy(delta, cx, cy){
  const prev = lbScale;
  lbScale = Math.min(lbMaxScale(), Math.max(1, +(lbScale + delta).toFixed(2)));
  if(lbScale === 1){ lbX = 0; lbY = 0; }
  else if(typeof cx === 'number' && typeof cy === 'number'){
    const rect = lightboxImg.getBoundingClientRect();
    const ox = cx - (rect.left + rect.width / 2);
    const oy = cy - (rect.top + rect.height / 2);
    lbX -= ox * (lbScale / prev - 1);
    lbY -= oy * (lbScale / prev - 1);
  }
  applyLbTransform();
}

lbZoomIn.onclick = (e)=>{ e.stopPropagation(); zoomBy(0.25); };
lbZoomOut.onclick = (e)=>{ e.stopPropagation(); zoomBy(-0.25); };
lbZoomReset.onclick = (e)=>{ e.stopPropagation(); resetLbZoom(); };
lbClose.onclick = (e)=>{ e.stopPropagation(); closeLightbox(); };

lightbox.addEventListener('click', (e)=>{
  if(e.target === lightbox || e.target === lbStage) closeLightbox();
});
lightboxImg.addEventListener('click', (e)=> e.stopPropagation());
lightboxImg.addEventListener('dblclick', (e)=>{
  e.stopPropagation();
  if(lbScale === 1) zoomBy(1, e.clientX, e.clientY);
  else resetLbZoom();
});
lightbox.addEventListener('wheel', (e)=>{
  if(!lightbox.classList.contains('show')) return;
  e.preventDefault();
  zoomBy(e.deltaY < 0 ? 0.2 : -0.2, e.clientX, e.clientY);
}, {passive:false});

lightboxImg.addEventListener('pointerdown', (e)=>{
  if(lbScale <= 1) return;
  lbDragging = true;
  lbLastX = e.clientX; lbLastY = e.clientY;
  lightboxImg.classList.add('dragging');
  lightboxImg.setPointerCapture(e.pointerId);
});
lightboxImg.addEventListener('pointermove', (e)=>{
  if(!lbDragging) return;
  lbX += e.clientX - lbLastX;
  lbY += e.clientY - lbLastY;
  lbLastX = e.clientX; lbLastY = e.clientY;
  applyLbTransform();
});
lightboxImg.addEventListener('pointerup', ()=>{
  lbDragging = false;
  lightboxImg.classList.remove('dragging');
});
lightboxImg.addEventListener('pointercancel', ()=>{
  lbDragging = false;
  lightboxImg.classList.remove('dragging');
});


document.addEventListener('keydown', (e)=>{
  if(lightbox.classList.contains('show') && e.key!=='Escape'){
    if(e.key==='+' || e.key==='='){ zoomBy(0.25); return; }
    if(e.key==='-' || e.key==='_'){ zoomBy(-0.25); return; }
    if(e.key==='0'){ resetLbZoom(); return; }
    return;
  }
  const slideEl = stage.querySelector('.slide');
  // allow normal page-like scrolling with arrows only when not at edge? Keep Space/Page for slides.
  if(['PageDown','PageUp'].includes(e.key) || (e.key===' ' && !e.target.closest('input,textarea'))) e.preventDefault();
  if(lang==='ar'){
    if(e.key==='ArrowLeft' || e.key===' ' || e.key==='PageDown') next();
    if(e.key==='ArrowRight' || e.key==='PageUp') prev();
  } else {
    if(e.key==='ArrowRight' || e.key===' ' || e.key==='PageDown') next();
    if(e.key==='ArrowLeft' || e.key==='PageUp') prev();
  }
  if(e.key==='Escape'){ if(lightbox.classList.contains('show')) closeLightbox(); if(document.fullscreenElement) document.exitFullscreen(); }
  if(e.key.toLowerCase()==='e'){ lang='en'; render(); }
  if(e.key.toLowerCase()==='a'){ lang='ar'; render(); }
});

// wheel on stage should scroll the active slide, not get trapped
stage.addEventListener('wheel', (e)=>{
  const slideEl = stage.querySelector('.slide');
  if(!slideEl) return;
  // native overflow handles it; ensure focus
}, {passive:true});

render();
</script>
