<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<!-- v:20260803g -->
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GazaCare Connect — عرض المشروع</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Outfit:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#f5fafb; --ink:#123037; --muted:#4f6d74; --teal:#0f8f86; --teal2:#0b6f69;
  --line:rgba(15,143,134,.16); --card:#fff; --warn:#7a5c00;
  --ar:"Cairo",sans-serif; --en:"Outfit",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--ar)}
body{overflow:hidden}
body.en{font-family:var(--en)}
body.en .slide-title,body.en .summary,body.en .lead,body.en .bullet,body.en .note,body.en .caption,body.en .section-sub{direction:ltr;text-align:left}
body.en table{direction:ltr}
#app{height:100%;display:grid;grid-template-rows:58px minmax(0,1fr) auto}
.topbar,.nav{background:#fff;border-color:var(--line)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 14px;border-bottom:1px solid var(--line)}
.brand{display:flex;gap:10px;align-items:center;min-width:0}
.logo{width:40px;height:40px;border-radius:10px;overflow:hidden;background:#fff;flex-shrink:0;display:block;object-fit:contain;padding:2px;box-sizing:border-box;border:1px solid var(--line)}
.brand h1{font-size:14px;margin:0}
.brand small{display:block;color:var(--muted);font-size:11px;font-family:var(--en)}
.actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:8px 12px;font:700 12px var(--ar);cursor:pointer;text-decoration:none}
.btn.primary{background:linear-gradient(135deg,var(--teal),var(--teal2));color:#fff;border:0}
.btn.active{background:rgba(15,143,134,.12);color:var(--teal2);border-color:var(--teal)}
.stage{min-height:0;overflow:hidden;position:relative}
.slide{
  position:absolute;inset:0;display:none;overflow:auto;overscroll-behavior:contain;
  padding:22px 28px 28px;
  background:
    radial-gradient(800px 360px at 100% 0%, rgba(15,143,134,.08), transparent 60%),
    radial-gradient(700px 320px at 0% 100%, rgba(11,111,105,.06), transparent 55%),
    var(--bg);
  -webkit-overflow-scrolling:touch;
}
.slide.active{display:block;animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.slide-inner{max-width:1180px;margin:0 auto;padding-bottom:24px}
.kicker{font-family:var(--en);letter-spacing:.12em;text-transform:uppercase;color:var(--teal);font-size:11px;margin-bottom:8px}
.slide-title{font-size:clamp(24px,3.2vw,36px);line-height:1.35;margin:0 0 10px;max-width:28ch}
.section-sub{color:var(--muted);font-size:15px;margin:0 0 14px;line-height:1.7}
.summary-box{margin-bottom:18px}
.summary-title{
  display:inline-block;margin:0 0 12px;padding:6px 12px;border-radius:999px;
  background:rgba(15,143,134,.12);color:#0b6a64;font-size:13px;font-weight:800
}
.summary-points{display:flex;flex-direction:column;gap:10px}
.summary-point{
  display:flex;gap:12px;align-items:flex-start;background:#fff;border:1px solid var(--line);
  border-radius:14px;padding:14px 16px;box-shadow:0 6px 18px rgba(18,48,55,.04)
}
.summary-point .n{
  flex:0 0 auto;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--teal),var(--teal2));color:#fff;
  font-family:var(--en);font-weight:800;font-size:13px
}
.summary-point p{margin:0;font-size:17px;line-height:1.85;font-weight:600;color:var(--ink)}
.section-slide .summary-point p{font-size:18px;line-height:1.9}
.slide-title{letter-spacing:-0.01em}

.layout{display:grid;grid-template-columns:1.1fr .9fr;gap:16px;align-items:start}
.layout.solo,.layout.gallery-only{grid-template-columns:1fr}
@media(max-width:980px){.layout{grid-template-columns:1fr}}
.bullets{display:flex;flex-direction:column;gap:10px}
.bullet{
  display:flex;gap:12px;align-items:flex-start;background:#fff;border:1px solid var(--line);
  border-radius:14px;padding:12px 14px;box-shadow:0 6px 18px rgba(18,48,55,.04)
}
.num{flex:0 0 auto;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(135deg,var(--teal),var(--teal2));color:#fff;font-family:var(--en);font-weight:800;font-size:12px}
.bullet p{margin:0;font-size:15px;line-height:1.75}
.lead{
  margin:0 0 14px;padding:12px 14px;border-radius:12px;
  background:rgba(15,143,134,.06);border:1px solid rgba(15,143,134,.14);
  color:var(--ink);font-size:15.5px;line-height:1.75;font-weight:600
}
.note{
  margin:0 0 14px;padding:12px 14px;border-radius:12px;
  background:#fff8ef;border:1px solid rgba(196,120,42,.25);
  color:#8a4b12;font-weight:700;font-size:14px;line-height:1.7
}
.note.bottom{margin:14px 0 0}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:14px;background:#fff;box-shadow:0 6px 18px rgba(18,48,55,.04)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:11px 12px;border-bottom:1px solid rgba(15,143,134,.1);vertical-align:top;line-height:1.65}
th{background:rgba(15,143,134,.1);color:#0b5f59;position:sticky;top:0}
tr:nth-child(even) td{background:#f7fbfc}
.gallery{display:grid;gap:12px}
.gallery.g1{grid-template-columns:1fr}
.gallery.g2{grid-template-columns:1fr 1fr}
.gallery.g3{grid-template-columns:1fr 1fr}
.gallery.g4,.gallery.g5,.gallery.g-many{grid-template-columns:repeat(3,minmax(0,1fr))}
@media(max-width:980px){.gallery.g4,.gallery.g5,.gallery.g-many{grid-template-columns:1fr 1fr}}
@media(max-width:700px){.gallery.g2,.gallery.g3,.gallery.g4,.gallery.g5,.gallery.g-many{grid-template-columns:1fr}}
.shot{
  background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;
  box-shadow:0 8px 22px rgba(18,48,55,.05);cursor:zoom-in
}
.shot .img-box{
  background:#eef6f7;min-height:180px;max-height:420px;display:flex;align-items:center;justify-content:center;padding:10px
}
.gallery.g1 .shot .img-box{min-height:280px;max-height:min(62vh,640px)}
.shot img{max-width:100%;max-height:400px;width:auto;height:auto;object-fit:contain;display:block;image-rendering:auto}
.gallery.g1 .shot img{max-height:min(58vh,600px)}
.caption{padding:10px 12px;font-size:12.5px;color:var(--muted);border-top:1px solid var(--line)}
.section-slide .slide-title{margin-top:8vh;font-size:clamp(30px,4.5vw,48px)}
.nav{
  display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;
  padding:10px 16px;border-top:1px solid var(--line);background:#fff;min-height:72px
}
.nav-mid{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0;width:100%}
.nav-actions{display:flex;align-items:center;gap:8px;flex-shrink:0}
.nav-btn{
  display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px;border:1px solid var(--line);
  border-radius:999px;background:#fff;color:var(--teal2);cursor:pointer;font:700 13px var(--ar);
  position:relative
}
.nav-btn:hover{background:var(--teal2);color:#fff;border-color:var(--teal2)}
.nav-btn span.arrow{font-family:var(--en);font-size:16px;line-height:1}
.progress-text{
  font-family:var(--ar);font-size:13px;color:var(--ink);text-align:center;font-weight:800;
  white-space:nowrap;line-height:1.4;flex-shrink:0;padding:0 8px
}
.chapter-rail{
  display:flex;flex-wrap:nowrap;gap:6px;justify-content:flex-start;align-items:center;
  max-width:100%;overflow-x:auto;overflow-y:hidden;padding:2px 4px;scrollbar-width:thin
}
.bar{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,var(--teal),#7ad9d1);z-index:30;width:0;transition:width .25s}
.chip{
  border:1px solid var(--line);background:#fff;color:#355965;border-radius:999px;
  padding:6px 11px;font-size:12px;cursor:pointer;font-family:var(--ar);font-weight:700;white-space:nowrap
}
.chip:hover{border-color:var(--teal);color:var(--teal2)}
.chip.on{background:var(--teal);color:#fff;border-color:transparent}
body.en .nav-btn, body.en .chip, body.en .progress-text{font-family:var(--en)}
.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:#fff;border:1px solid var(--line);padding:10px 14px;border-radius:999px;font-size:12px;opacity:0;pointer-events:none;transition:.25s;z-index:40;box-shadow:0 10px 28px rgba(18,48,55,.1)}
.toast.show{opacity:1}
.lightbox{
  position:fixed;inset:0;background:rgba(8,24,28,.82);display:none;
  align-items:center;justify-content:center;z-index:50;padding:18px;overflow:hidden
}
.lightbox.show{display:flex}
.lightbox-stage{
  position:relative;width:min(1200px,96vw);height:min(90vh,920px);
  display:flex;align-items:center;justify-content:center;overflow:hidden;
  background:#fff;border-radius:14px;box-shadow:0 18px 50px rgba(0,0,0,.28)
}
.lightbox img{
  max-width:none;max-height:none;width:auto;height:auto;object-fit:contain;
  transform-origin:center center;transition:transform .08s linear;user-select:none;
  -webkit-user-drag:none;cursor:grab;padding:0;background:#fff;
  image-rendering:-webkit-optimize-contrast;image-rendering:auto
}
.lightbox img.dragging{cursor:grabbing;transition:none}
.lightbox-ui{
  position:absolute;bottom:22px;left:50%;transform:translateX(-50%);
  display:flex;gap:8px;align-items:center;z-index:2;
  background:rgba(255,255,255,.94);border:1px solid rgba(15,143,134,.25);
  border-radius:999px;padding:8px 10px;box-shadow:0 10px 28px rgba(0,0,0,.18)
}
.lightbox-ui button{
  border:0;background:linear-gradient(135deg,var(--teal),var(--teal2));color:#fff;
  width:36px;height:36px;border-radius:999px;font:800 18px var(--en);cursor:pointer
}
.lightbox-ui button:hover{filter:brightness(1.05)}
.lightbox-ui .zoom-label{
  min-width:58px;text-align:center;font:800 13px var(--en);color:#0b5f59
}
.lightbox-close{
  position:absolute;top:18px;inset-inline-end:18px;z-index:2;
  border:0;background:#fff;color:#0b5f59;width:40px;height:40px;border-radius:999px;
  font:800 20px var(--en);cursor:pointer;box-shadow:0 8px 22px rgba(0,0,0,.18)
}
.hint{color:var(--muted);font-size:12px;margin-top:8px}

/* ===== Mobile / responsive ===== */
@media (max-width:860px){
  #app{grid-template-rows:auto minmax(0,1fr) auto}
  .topbar{flex-wrap:wrap;align-items:center;gap:8px;padding:8px 10px;height:auto}
  .brand{min-width:0;flex:1}
  .brand h1{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:52vw}
  .brand small{display:none}
  .logo{width:32px;height:32px}
  .actions{width:100%;overflow-x:auto;flex-wrap:nowrap;gap:4px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .actions::-webkit-scrollbar{display:none}
  .btn{flex:0 0 auto;padding:7px 10px;font-size:11px;white-space:nowrap}
  .slide{padding:14px 12px 20px}
  .slide-title{max-width:none;font-size:clamp(20px,6.2vw,28px)}
  .section-slide .slide-title{margin-top:3vh;font-size:clamp(22px,7vw,34px)}
  .summary-point,.bullet{padding:10px 12px;gap:10px}
  .summary-point p{font-size:14.5px;line-height:1.7}
  .bullet p,.lead,.note{font-size:13.5px;line-height:1.65}
  .summary-point .n,.num{width:24px;height:24px;font-size:11px}
  .table-wrap{-webkit-overflow-scrolling:touch}
  table{font-size:12px;min-width:480px}
  th,td{padding:8px}
  .gallery.g1 .shot .img-box{min-height:160px;max-height:280px}
  .shot img,.gallery.g1 .shot img{max-height:240px}
  .nav{grid-template-columns:auto 1fr auto;gap:8px;padding:8px 10px;min-height:0}
  .nav-btn{height:36px;padding:0 10px}
  .nav-btn #prevLabel,.nav-btn #nextLabel{
    position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)
  }
  .progress-text{font-size:12px}
  .chip{padding:5px 9px;font-size:11px}
  .lightbox{padding:8px}
  .lightbox-stage{width:100%;height:min(78vh,720px);border-radius:10px}
  .lightbox-ui{bottom:12px}
  .lightbox-close{top:10px}
}
@media (max-width:480px){
  .btn#btnFs,a#btnPptxEn{display:none}
}

@media print{
  .topbar,.nav,.bar,.hint,.lightbox,.toast,.lightbox-ui,.lightbox-close{display:none!important}
  html,body{background:#fff!important;overflow:visible!important;height:auto!important}
  #app{display:block!important;height:auto!important}
  .stage{display:block!important;height:auto!important;overflow:visible!important;padding:0!important}
  .slide{
    position:relative!important;display:block!important;overflow:visible!important;
    page-break-after:always;break-after:page;height:auto!important;min-height:0!important;
    background:#fff!important;border:0!important;box-shadow:none!important;margin:0!important
  }
  .slide-inner{max-width:100%!important;padding:18mm 14mm!important}
  .slide-title{font-size:22pt!important;color:#123037!important;text-align:right!important}
  body.en .slide-title{text-align:left!important}
  .summary-point p,.bullet p,.lead,.note{font-size:12.5pt!important;line-height:1.55!important;color:#123037!important}
  .summary-point,.bullet{box-shadow:none!important;border:1px solid #d7e6e8!important;break-inside:avoid}
  table{font-size:10.5pt!important}
  th,td{padding:8px!important}
  .shot{break-inside:avoid;box-shadow:none!important}
  .shot img{max-height:90mm!important}
  .kicker{color:#0b6a64!important}
}
</style>
</head>

let lang = 'ar';
let idx = 0;
const stage = document.getElementById('stage');
const prog = document.getElementById('prog');
const bar = document.getElementById('bar');
const rail = document.getElementById('rail');
const toast = document.getElementById('toast');
const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightboxImg');

function t(obj){ return (obj && (obj[lang] || obj.ar || '')) || ''; }
function showToast(msg){ toast.textContent = msg; toast.classList.add('show'); setTimeout(()=>toast.classList.remove('show'), 2000); }

function renderRail(){
  const chapters = [...new Set(SLIDES.map(s=>s.chapter).filter(Boolean))];
  rail.innerHTML = chapters.map(c=>{
    const first = SLIDES.findIndex(s=>s.chapter===c);
    const on = SLIDES[idx].chapter===c ? 'on' : '';
    const label = lang==='ar' ? (`الفصل ${c}`) : (`Ch ${c}`);
    return `<button class="chip ${on}" type="button" data-i="${first}">${label}</button>`;
  }).join('');
  rail.querySelectorAll('.chip').forEach(b=>b.onclick=()=>go(+b.dataset.i));
}

function updateNavLabels(){
  const prevLabel = document.getElementById('prevLabel');
  const nextLabel = document.getElementById('nextLabel');
  const prevArrow = document.getElementById('prevArrow');
  const nextArrow = document.getElementById('nextArrow');
  if(lang==='ar'){
    prevLabel.textContent = 'السابق';
    nextLabel.textContent = 'التالي';
    prevArrow.textContent = '→';
    nextArrow.textContent = '←';
  } else {
    prevLabel.textContent = 'Prev';
    nextLabel.textContent = 'Next';
    prevArrow.textContent = '←';
    nextArrow.textContent = '→';
  }
}

function shot(im){
  return `<figure class="shot" data-full="${im.src}">
    <div class="img-box"><img src="${im.src}" alt="${im['caption_'+lang]||''}" loading="lazy" /></div>
    <figcaption class="caption">${im['caption_'+lang]||''}</figcaption>
  </figure>`;
}

function render(){
  document.documentElement.lang = lang;
  document.documentElement.dir = lang==='ar' ? 'rtl' : 'ltr';
  document.body.classList.toggle('en', lang==='en');
  document.getElementById('btnAr').classList.toggle('active', lang==='ar');
  document.getElementById('btnEn').classList.toggle('active', lang==='en');
  document.getElementById('brandSub').textContent = lang==='ar'
    ? 'مشروع تخرج · هندسة البرمجيات'
    : 'Graduation Project · Software Engineering';
  document.getElementById('btnFs').textContent = lang==='ar' ? 'ملء الشاشة' : 'Fullscreen';
  document.getElementById('btnPptx').textContent = lang==='ar' ? 'تصدير PPTX' : 'Export PPTX AR';
  document.getElementById('btnPptxEn').textContent = lang==='ar' ? 'PPTX إنجليزي' : 'Export PPTX EN';

  const s = SLIDES[idx];
  const bullets = (s.bullets && s.bullets[lang]) || [];
  const imgs = s.images || [];
  const hasTable = !!s.table;
  const hasBullets = bullets.length > 0;
  const hasImgs = imgs.length > 0;
  const summary = t(s.summary);
  const subtitle = t(s.subtitle);
  const note = t(s.note);

  let body = '';
  const summaryPoints = ((s.summary_points && s.summary_points[lang]) || []).filter(Boolean);
  const leadBlock = summary
    ? `<div class="lead">${summary}</div>`
    : '';
  const noteTop = note ? `<div class="note">${note}</div>` : '';
  const summaryBlock = summaryPoints.length ? `
      <div class="summary-box">
        <div class="summary-points">
          ${summaryPoints.map((b,i)=>`<div class="summary-point"><div class="n">${i+1}</div><p>${b}</p></div>`).join('')}
        </div>
      </div>` : '';

  if(s.kind === 'section'){
    body = `
      ${summaryBlock}
      ${subtitle ? `<div class="section-sub">${subtitle}</div>` : ''}
      ${hasImgs ? `<div class="gallery g1">${shot(imgs[0])}</div>` : ''}`;
  } else {
    let left = '';
    if(leadBlock) left += leadBlock;
    if(noteTop) left += noteTop;
    if(summaryBlock) left += summaryBlock;
    if(hasBullets){
      left += `<div class="bullets">${bullets.map((b,i)=>`<div class="bullet"><div class="num">${i+1}</div><p>${b}</p></div>`).join('')}</div>`;
    }
    if(hasTable){
      const headers = s.table['headers_'+lang] || s.table.headers_ar;
      const rows = s.table['rows_'+lang] || s.table.rows_ar;
      left += `<div class="table-wrap" style="margin-top:${hasBullets||summary||summaryPoints.length?'12px':'0'}"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    }
    let right = '';
    if(hasImgs){
      const gClass = imgs.length <= 5 ? ('g' + Math.max(imgs.length,1)) : 'g-many';
      const gal = `<div class="gallery ${gClass}" style="margin-top:${hasTable||hasBullets||summaryPoints.length||summary||note?'14px':'0'}">${imgs.map(shot).join('')}</div>`;
      if(imgs.length >= 3){
        left += gal;
      } else {
        right = gal;
      }
    }
    const layoutClass = (!right ? 'solo' : (s.kind==='gallery' && !hasBullets && !hasTable ? 'gallery-only' : ''));
    body = `<div class="layout ${layoutClass}"><div>${left}</div>${right?`<div>${right}</div>`:''}</div>`;
  }

  const kicker = s.chapter
    ? (lang==='ar' ? `الفصل ${s.chapter}` : `Chapter ${s.chapter}`)
    : 'GazaCare Connect';

  stage.innerHTML = `<section class="slide active ${s.kind==='section'||s.kind==='hero'?'section-slide':''}">
    <div class="slide-inner">
      <div class="kicker">${kicker}</div>
      <h2 class="slide-title">${t(s.title)}</h2>
      ${subtitle && s.kind!=='section' ? `<div class="section-sub">${subtitle}</div>` : ''}
      ${body}
    </div>
  </section>`;

  stage.querySelectorAll('.shot').forEach(fig=>{
    fig.addEventListener('click', ()=> openLightbox(fig.dataset.full));
  });

  prog.textContent = lang==='ar' ? `الشريحة ${idx+1} من ${SLIDES.length}` : `Slide ${idx+1} of ${SLIDES.length}`;
  updateNavLabels();
  bar.style.width = `${((idx+1)/SLIDES.length)*100}%`;
  renderRail();
  // reset scroll to top of new slide
  const slideEl = stage.querySelector('.slide');
  if(slideEl) slideEl.scrollTop = 0;
}

function go(i){ idx = Math.max(0, Math.min(SLIDES.length-1, i)); render(); }
function next(){ go(idx+1); }
function prev(){ go(idx-1); }

document.getElementById('next').onclick = next;
document.getElementById('prev').onclick = prev;
document.getElementById('btnAr').onclick = ()=>{ lang='ar'; render(); };
document.getElementById('btnEn').onclick = ()=>{ lang='en'; render(); };
document.getElementById('btnFs').onclick = ()=>{
  if(!document.fullscreenElement) document.documentElement.requestFullscreen();
  else document.exitFullscreen();
};

let lbScale = 1, lbFit = 1, lbX = 0, lbY = 0, lbDragging = false, lbLastX = 0, lbLastY = 0;
const lbStage = document.getElementById('lbStage');
const lbZoomLabel = document.getElementById('lbZoomLabel');
const lbClose = document.getElementById('lbClose');
const lbZoomIn = document.getElementById('lbZoomIn');
const lbZoomOut = document.getElementById('lbZoomOut');
const lbZoomReset = document.getElementById('lbZoomReset');

function lbMaxScale(){
  // Allow zoom at least to native resolution, and a bit beyond.
  return Math.min(8, Math.max(4, 1 / Math.max(lbFit, 0.05)));
}
function applyLbTransform(){
  const nw = lightboxImg.naturalWidth || 1;
  const displayW = Math.max(1, nw * lbFit * lbScale);
  lightboxImg.style.width = displayW + 'px';
  lightboxImg.style.height = 'auto';
  lightboxImg.style.transform = `translate(${lbX}px, ${lbY}px)`;
  lbZoomLabel.textContent = Math.round(lbScale * 100) + '%';
  lightboxImg.style.cursor = lbScale > 1 ? (lbDragging ? 'grabbing' : 'grab') : 'zoom-in';
}
function resetLbZoom(){
  lbScale = 1; lbX = 0; lbY = 0; lbDragging = false;
  applyLbTransform();
}
function computeLbFit(){
  const nw = lightboxImg.naturalWidth;
  const nh = lightboxImg.naturalHeight;
  if(!nw || !nh) return 1;
  const rect = lbStage.getBoundingClientRect();
  const pad = 28;
  return Math.min((rect.width - pad) / nw, (rect.height - pad) / nh, 1);
}
function prepareLightboxImage(){
  lbFit = computeLbFit();
  resetLbZoom();
}
function openLightbox(src){
  lightbox.classList.add('show');
  lightbox.setAttribute('aria-hidden', 'false');
  lightboxImg.onload = prepareLightboxImage;
  if(lightboxImg.getAttribute('src') === src && lightboxImg.complete && lightboxImg.naturalWidth){
    prepareLightboxImage();
  } else {
    lightboxImg.src = src;
  }
}
function closeLightbox(){
  lightbox.classList.remove('show');
  lightbox.setAttribute('aria-hidden', 'true');
  resetLbZoom();
}
function zoomBy(delta, cx, cy){
  const prev = lbScale;
  lbScale = Math.min(lbMaxScale(), Math.max(1, +(lbScale + delta).toFixed(2)));
  if(lbScale === 1){ lbX = 0; lbY = 0; }
  else if(typeof cx === 'number' && typeof cy === 'number'){
    const rect = lightboxImg.getBoundingClientRect();
    const ox = cx - (rect.left + rect.width / 2);
    const oy = cy - (rect.top + rect.height / 2);
    lbX -= ox * (lbScale / prev - 1);
    lbY -= oy * (lbScale / prev - 1);
  }
  applyLbTransform();
}

lbZoomIn.onclick = (e)=>{ e.stopPropagation(); zoomBy(0.25); };
lbZoomOut.onclick = (e)=>{ e.stopPropagation(); zoomBy(-0.25); };
lbZoomReset.onclick = (e)=>{ e.stopPropagation(); resetLbZoom(); };
lbClose.onclick = (e)=>{ e.stopPropagation(); closeLightbox(); };

lightbox.addEventListener('click', (e)=>{
  if(e.target === lightbox || e.target === lbStage) closeLightbox();
});
lightboxImg.addEventListener('click', (e)=> e.stopPropagation());
lightboxImg.addEventListener('dblclick', (e)=>{
  e.stopPropagation();
  if(lbScale === 1) zoomBy(1, e.clientX, e.clientY);
  else resetLbZoom();
});
lightbox.addEventListener('wheel', (e)=>{
  if(!lightbox.classList.contains('show')) return;
  e.preventDefault();
  zoomBy(e.deltaY < 0 ? 0.2 : -0.2, e.clientX, e.clientY);
}, {passive:false});

lightboxImg.addEventListener('pointerdown', (e)=>{
  if(lbScale <= 1) return;
  lbDragging = true;
  lbLastX = e.clientX; lbLastY = e.clientY;
  lightboxImg.classList.add('dragging');
  lightboxImg.setPointerCapture(e.pointerId);
});
lightboxImg.addEventListener('pointermove', (e)=>{
  if(!lbDragging) return;
  lbX += e.clientX - lbLastX;
  lbY += e.clientY - lbLastY;
  lbLastX = e.clientX; lbLastY = e.clientY;
  applyLbTransform();
});
lightboxImg.addEventListener('pointerup', ()=>{
  lbDragging = false;
  lightboxImg.classList.remove('dragging');
});
lightboxImg.addEventListener('pointercancel', ()=>{
  lbDragging = false;
  lightboxImg.classList.remove('dragging');
});


document.addEventListener('keydown', (e)=>{
  if(lightbox.classList.contains('show') && e.key!=='Escape'){
    if(e.key==='+' || e.key==='='){ zoomBy(0.25); return; }
    if(e.key==='-' || e.key==='_'){ zoomBy(-0.25); return; }
    if(e.key==='0'){ resetLbZoom(); return; }
    return;
  }
  const slideEl = stage.querySelector('.slide');
  // allow normal page-like scrolling with arrows only when not at edge? Keep Space/Page for slides.
  if(['PageDown','PageUp'].includes(e.key) || (e.key===' ' && !e.target.closest('input,textarea'))) e.preventDefault();
  if(lang==='ar'){
    if(e.key==='ArrowLeft' || e.key===' ' || e.key==='PageDown') next();
    if(e.key==='ArrowRight' || e.key==='PageUp') prev();
  } else {
    if(e.key==='ArrowRight' || e.key===' ' || e.key==='PageDown') next();
    if(e.key==='ArrowLeft' || e.key==='PageUp') prev();
  }
  if(e.key==='Escape'){ if(lightbox.classList.contains('show')) closeLightbox(); if(document.fullscreenElement) document.exitFullscreen(); }
  if(e.key.toLowerCase()==='e'){ lang='en'; render(); }
  if(e.key.toLowerCase()==='a'){ lang='ar'; render(); }
});

// wheel on stage should scroll the active slide, not get trapped
stage.addEventListener('wheel', (e)=>{
  const slideEl = stage.querySelector('.slide');
  if(!slideEl) return;
  // native overflow handles it; ensure focus
}, {passive:true});

render();
</script>
</body>
</html>
